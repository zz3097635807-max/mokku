<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark-purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EroMuse · AI R18小说创作工坊</title>
    <style>
        /* ============================================
           [1] CSS变量 - 主题系统
           ============================================ */
        :root {
            /* 深紫主题(默认) */
            --bg-primary: #0d0b1a;
            --bg-secondary: #161230;
            --bg-tertiary: #1e1845;
            --bg-card: #1a1538;
            --bg-input: #12102a;
            --bg-hover: #2a2260;
            --bg-active: #362d75;
            --bg-modal-overlay: rgba(5, 3, 15, 0.85);
            --text-primary: #e8e4f5;
            --text-secondary: #a89ec8;
            --text-muted: #6b6190;
            --text-placeholder: #4a4070;
            --accent-primary: #b388ff;
            --accent-secondary: #7c4dff;
            --accent-tertiary: #ea80fc;
            --accent-nsfw: #ff4081;
            --accent-success: #69f0ae;
            --accent-warning: #ffd740;
            --accent-danger: #ff5252;
            --accent-info: #40c4ff;
            --border-color: #2d2755;
            --border-active: #7c4dff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(179,136,255,0.15);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            --font-serif: 'Noto Serif SC', 'Georgia', serif;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 280px;
            --topbar-height: 52px;
            --panel-min: 320px;
        }

        /* 深蓝主题 */
        [data-theme="dark-blue"] {
            --bg-primary: #0a0e1a;
            --bg-secondary: #101828;
            --bg-tertiary: #182038;
            --bg-card: #141c30;
            --bg-input: #0c1220;
            --bg-hover: #1e3050;
            --bg-active: #254070;
            --text-primary: #e0e8f5;
            --text-secondary: #8ea8c8;
            --text-muted: #506880;
            --accent-primary: #64b5f6;
            --accent-secondary: #1e88e5;
            --accent-tertiary: #82b1ff;
            --border-color: #1e3050;
            --border-active: #1e88e5;
        }

        /* 墨绿主题 */
        [data-theme="dark-green"] {
            --bg-primary: #0b1410;
            --bg-secondary: #122018;
            --bg-tertiary: #1a3025;
            --bg-card: #152a1e;
            --bg-input: #0d1810;
            --bg-hover: #1e4030;
            --bg-active: #2a5840;
            --text-primary: #e0f0e8;
            --text-secondary: #8ec0a0;
            --text-muted: #507860;
            --accent-primary: #69f0ae;
            --accent-secondary: #00c853;
            --accent-tertiary: #b9f6ca;
            --border-color: #1e4030;
            --border-active: #00c853;
        }

        /* 纯黑主题 */
        [data-theme="dark-black"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --bg-card: #0f0f0f;
            --bg-input: #080808;
            --bg-hover: #1e1e1e;
            --bg-active: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #999999;
            --text-muted: #555555;
            --accent-primary: #bb86fc;
            --accent-secondary: #6200ee;
            --accent-tertiary: #cf6679;
            --border-color: #222222;
            --border-active: #6200ee;
        }

        /* ============================================
           [2] CSS Reset + 全局样式
           ============================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 14px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body { font-family: var(--font-main); background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; overflow: hidden; height: 100vh; width: 100vw; }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-secondary); }

        /* 选中文本 */
        ::selection { background: var(--accent-secondary); color: white; }

        /* 链接 */
        a { color: var(--accent-primary); text-decoration: none; transition: color var(--transition-fast); }
        a:hover { color: var(--accent-tertiary); }

        /* 通用按钮 */
        button { font-family: inherit; cursor: pointer; border: none; outline: none; transition: all var(--transition-fast); }

        /* 通用输入 */
        input, textarea, select { font-family: inherit; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 8px 12px; outline: none; transition: border-color var(--transition-fast); }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 2px rgba(179,136,255,0.15); }
        textarea { resize: vertical; line-height: 1.7; }
        input::placeholder, textarea::placeholder { color: var(--text-placeholder); }

        /* ============================================
           [3] 通用组件样式
           ============================================ */
        /* --- 按钮组 --- */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 500; white-space: nowrap; user-select: none; }
        .btn-primary { background: var(--accent-secondary); color: white; }
        .btn-primary:hover { background: var(--accent-primary); box-shadow: var(--shadow-glow); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { border-color: var(--accent-primary); background: var(--bg-hover); }
        .btn-danger { background: rgba(255,82,82,0.15); color: var(--accent-danger); border: 1px solid rgba(255,82,82,0.3); }
        .btn-danger:hover { background: rgba(255,82,82,0.25); }
        .btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 10px; }
        .btn-ghost:hover { color: var(--text-primary); background: var(--bg-hover); }
        .btn-icon { width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: transparent; color: var(--text-secondary); font-size: 1.1rem; }
        .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
        .btn-lg { padding: 10px 24px; font-size: 1rem; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* --- 徽章/标签 --- */
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-accent { background: rgba(179,136,255,0.15); color: var(--accent-primary); }
        .badge-nsfw { background: rgba(255,64,129,0.15); color: var(--accent-nsfw); }
        .badge-success { background: rgba(105,240,174,0.15); color: var(--accent-success); }
        .badge-warning { background: rgba(255,215,64,0.15); color: var(--accent-warning); }
        .badge-danger { background: rgba(255,82,82,0.15); color: var(--accent-danger); }

        /* --- 卡片 --- */
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; transition: all var(--transition-normal); }
        .card:hover { border-color: var(--accent-primary); box-shadow: var(--shadow-glow); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }

        /* --- 模态框 --- */
        .modal-overlay { position: fixed; inset: 0; background: var(--bg-modal-overlay); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: all var(--transition-normal); backdrop-filter: blur(8px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 90%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; transform: translateY(20px) scale(0.97); transition: transform var(--transition-normal); }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
        .modal-header h3 { font-size: 1.1rem; font-weight: 600; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 8px; }

        /* --- Tab选项卡 --- */
        .tabs { display: flex; gap: 2px; background: var(--bg-primary); border-radius: var(--radius-sm); padding: 3px; }
        .tab-item { padding: 7px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; transition: all var(--transition-fast); background: transparent; border: none; white-space: nowrap; }
        .tab-item:hover { color: var(--text-primary); background: var(--bg-hover); }
        .tab-item.active { background: var(--accent-secondary); color: white; font-weight: 600; }

        /* --- 表单组 --- */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; }
        .form-row { display: flex; gap: 12px; }
        .form-row > * { flex: 1; }

        /* --- 通知/Toast --- */
        .toast-container { position: fixed; top: 60px; right: 20px; z-index: 100000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: var(--radius-md); background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); font-size: 0.9rem; display: flex; align-items: center; gap: 10px; animation: toastIn 0.3s ease, toastOut 0.3s ease forwards; animation-delay: 0s, 3s; min-width: 250px; }
        .toast.toast-success { border-left: 3px solid var(--accent-success); }
        .toast.toast-error { border-left: 3px solid var(--accent-danger); }
        .toast.toast-warning { border-left: 3px solid var(--accent-warning); }
        .toast.toast-info { border-left: 3px solid var(--accent-info); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

        /* --- 下拉选择 --- */
        .select-wrapper { position: relative; }
        .select-wrapper select { appearance: none; padding-right: 32px; cursor: pointer; }
        .select-wrapper::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 0.8rem; }

        /* --- 滑块 --- */
        .slider-group { display: flex; align-items: center; gap: 12px; }
        .slider-group input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--border-color); border-radius: 2px; outline: none; border: none; padding: 0; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-primary); cursor: pointer; box-shadow: 0 0 6px rgba(179,136,255,0.4); }
        .slider-value { min-width: 40px; text-align: right; font-size: 0.85rem; color: var(--accent-primary); font-family: var(--font-mono); }

        /* --- 开关 --- */
        .toggle-switch { position: relative; width: 40px; height: 22px; cursor: pointer; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; inset: 0; background: var(--border-color); border-radius: 11px; transition: var(--transition-fast); }
        .toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--text-muted); border-radius: 50%; transition: var(--transition-fast); }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent-secondary); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); background: white; }

        /* --- 右键菜单 --- */
        .context-menu { position: fixed; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); min-width: 180px; z-index: 50000; padding: 6px; display: none; }
        .context-menu.active { display: block; }
        .context-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
        .context-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .context-menu-divider { height: 1px; background: var(--border-color); margin: 4px 8px; }

        /* --- 工具提示 --- */
        .tooltip { position: relative; }
        .tooltip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); color: var(--text-primary); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 0.78rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: all var(--transition-fast); pointer-events: none; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
        .tooltip:hover::after { opacity: 1; visibility: visible; }

        /* ============================================
           [4] 布局结构
           ============================================ */
        .app-container { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- 顶部导航栏 --- */
        .topbar { height: var(--topbar-height); background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 1000; }
        .topbar-brand { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: 700; color: var(--accent-primary); flex-shrink: 0; }
        .topbar-brand .brand-icon { font-size: 1.3rem; }
        .topbar-brand .brand-sub { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; margin-left: -4px; }
        .topbar-nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
        .topbar-nav::-webkit-scrollbar { display: none; }
        .topbar-nav-item { padding: 6px 14px; border-radius: var(--radius-sm); font-size: 0.82rem; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all var(--transition-fast); background: transparent; border: none; display: flex; align-items: center; gap: 5px; }
        .topbar-nav-item:hover { color: var(--text-primary); background: var(--bg-hover); }
        .topbar-nav-item.active { color: var(--accent-primary); background: var(--bg-active); font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

        /* API状态指示灯 */
        .api-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .api-status-dot.online { background: var(--accent-success); box-shadow: 0 0 6px var(--accent-success); }
        .api-status-dot.offline { background: var(--accent-danger); }
        .api-status-dot.unknown { background: var(--text-muted); }

        /* --- 主体区域 --- */
        .main-container { flex: 1; display: flex; overflow: hidden; }

        /* --- 左侧边栏 --- */
        .sidebar-left { width: var(--sidebar-width); background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: width var(--transition-normal); }
        .sidebar-left.collapsed { width: 48px; }
        .sidebar-header { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h4 { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
        .sidebar-footer { padding: 8px 12px; border-top: 1px solid var(--border-color); }

        /* 侧边栏项目 */
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); font-size: 0.85rem; transition: all var(--transition-fast); }
        .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-item.active { background: var(--bg-active); color: var(--accent-primary); }
        .sidebar-item .item-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }

        /* --- 中间内容区 --- */
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        /* 内容区头部工具栏 */
        .content-toolbar { padding: 8px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .content-toolbar .toolbar-group { display: flex; align-items: center; gap: 4px; }
        .content-toolbar .toolbar-divider { width: 1px; height: 24px; background: var(--border-color); margin: 0 6px; }
        .content-toolbar .toolbar-spacer { flex: 1; }

        /* 编辑器区域 */
        .editor-wrap { flex: 1; display: flex; overflow: hidden; }
        .editor-main { flex: 1; padding: 24px 32px; overflow-y: auto; line-height: 2; font-family: var(--font-serif); font-size: 1.05rem; }
        .editor-main:focus { outline: none; }

        /* --- 右侧面板 --- */
        .panel-right { width: 320px; background: var(--bg-secondary); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; transition: width var(--transition-normal); }
        .panel-right.collapsed { width: 0; border-left: none; }
        .panel-tabs { display: flex; border-bottom: 1px solid var(--border-color); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .panel-tabs::-webkit-scrollbar { display: none; }
        .panel-tab { padding: 10px 14px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all var(--transition-fast); background: none; border-top: none; border-left: none; border-right: none; }
        .panel-tab:hover { color: var(--text-secondary); }
        .panel-tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .panel-body { flex: 1; overflow-y: auto; padding: 12px; }

        /* --- 底部状态栏 --- */
        .statusbar { height: 28px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; gap: 16px; font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
        .statusbar-item { display: flex; align-items: center; gap: 4px; }
        .statusbar .spacer { flex: 1; }

        /* ============================================
           [5] 动画
           ============================================ */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .loading-spinner { width: 20px; height: 20px; border: 2px solid var(--border-color); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        .animate-fadeIn { animation: fadeIn 0.3s ease; }
        .animate-slideUp { animation: slideUp 0.4s ease; }

        /* ============================================
           [6] 移动端适配
           ============================================ */
        @media (max-width: 768px) {
            :root { --sidebar-width: 100%; --topbar-height: 48px; }
            html { font-size: 13px; }
            .sidebar-left { position: fixed; top: var(--topbar-height); left: 0; bottom: 28px; z-index: 5000; transform: translateX(-100%); transition: transform var(--transition-normal); width: 85%; max-width: 320px; }
            .sidebar-left.mobile-open { transform: translateX(0); }
            .panel-right { position: fixed; top: var(--topbar-height); right: 0; bottom: 28px; z-index: 5000; transform: translateX(100%); transition: transform var(--transition-normal); width: 85%; max-width: 360px; }
            .panel-right.mobile-open { transform: translateX(0); }
            .editor-main { padding: 16px; font-size: 1rem; }
            .topbar-brand .brand-sub { display: none; }
            .content-toolbar { padding: 6px 10px; }
            .modal { width: 95%; max-height: 90vh; }
        }

        @media (max-width: 480px) {
            .topbar-nav-item span { display: none; }
            .topbar-nav-item { padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <!-- ============================================
         APP 主容器
         ============================================ -->
    <div class="app-container" id="app">
        <!-- 顶部导航栏 -->
        <header class="topbar">
            <div class="topbar-brand">
                <span class="brand-icon">🔮</span>
                <span>EroMuse</span>
                <span class="brand-sub">R18创作工坊</span>
            </div>
            <nav class="topbar-nav" id="mainNav">
                <button class="topbar-nav-item active" data-page="workspace" onclick="APP.switchPage('workspace')"> <span>📝</span> <span>创作台</span> </button>
                <button class="topbar-nav-item" data-page="outline" onclick="APP.switchPage('outline')"> <span>📋</span> <span>大纲</span> </button>
                <button class="topbar-nav-item" data-page="worldbook" onclick="APP.switchPage('worldbook')"> <span>🌍</span> <span>世界书</span> </button>
                <button class="topbar-nav-item" data-page="characters" onclick="APP.switchPage('characters')"> <span>👤</span> <span>角色</span> </button>
                <button class="topbar-nav-item" data-page="chapters" onclick="APP.switchPage('chapters')"> <span>📖</span> <span>章节</span> </button>
                <button class="topbar-nav-item" data-page="branches" onclick="APP.switchPage('branches')"> <span>🌿</span> <span>分支</span> </button>

            <div class="modal-body"> <p id="confirmMessage"></p> </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="APP.closeModal('confirm')">取消</button>
                <button class="btn btn-primary" id="confirmOk">确定</button>
            </div>

    <!-- page-view 隐藏逻辑 -->
    <style>
        .page-view { display: none; flex-direction: column; height: 100%; }
        .page-view.active { display: flex; }
    </style>

    <!-- ============================================
         [1] 核心JavaScript代码
         ============================================ -->
    <script>
        // ============================================
        // [核心] 全局应用对象
        // ============================================
        const APP = {
            // 当前状态
            state: {
                currentPage: 'workspace',
                currentProject: null,
                currentChapter: null,
                currentBranch: 'main',
                sidebarOpen: true,
                panelOpen: true,
                panelTab: 'memory',
                projects: [],
                apiConfigs: {},
                settings: {},
            },

            // ============================================
            // 初始化
            // ============================================
            async init() {
                console.log('[EroMuse] Initializing...');
                await DB.init();
                await this.loadState();
                this.renderSidebar();
                this.renderPanel();
                this.initEditor();
                this.initKeyboard();
                this.initContextMenu();
                this.initAutoSave();
                this.updateStatus();
                console.log('[EroMuse] Ready.');
            },

            // ============================================
            // 页面切换
            // ============================================
            switchPage(page) {
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.topbar-nav-item').forEach(n => n.classList.remove('active'));
                const pageEl = document.getElementById(`page-${page}`);
                const navEl = document.querySelector(`.topbar-nav-item[data-page="${page}"]`);
                if (pageEl) pageEl.classList.add('active');
                if (navEl) navEl.classList.add('active');
                this.state.currentPage = page;
                // 根据页面加载对应内容
                this.onPageEnter(page);
            },

            onPageEnter(page) {
                const loaders = {
                    'workspace': () => this.loadWorkspace(),
                    'outline': () => this.loadOutlinePage(),
                    'worldbook': () => this.loadWorldbookPage(),
                    'characters': () => this.loadCharactersPage(),
                    'chapters': () => this.loadChaptersPage(),
                    'branches': () => this.loadBranchesPage(),
                    'nsfwlib': () => this.loadNSFWLibPage(),
                    'gallery': () => this.loadGalleryPage(),
                    'analytics': () => this.loadAnalyticsPage(),
                };
                if (loaders[page]) loaders[page]();
            },

            // ============================================
            // 侧边栏
            // ============================================
            toggleSidebar() {
                const sb = document.getElementById('sidebarLeft');
                sb.classList.toggle('collapsed');
                this.state.sidebarOpen = !sb.classList.contains('collapsed');
            },

            toggleSidebarMobile() {
                const sb = document.getElementById('sidebarLeft');
                sb.classList.toggle('mobile-open');
            },

            togglePanel() {
                const panel = document.getElementById('panelRight');
                panel.classList.toggle('collapsed');
                this.state.panelOpen = !panel.classList.contains('collapsed');
            },

            // ============================================
            // 面板切换
            // ============================================
            switchPanel(tab) {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                const tabEl = document.querySelector(`.panel-tab[data-panel="${tab}"]`);
                if (tabEl) tabEl.classList.add('active');
                this.state.panelTab = tab;
                this.renderPanel();
            },

            // ============================================
            // 模态框
            // ============================================
            openModal(name) {
                const modal = document.getElementById(`modal-${name}`);
                if (modal) {
                    modal.classList.add('active');
                    // 渲染模态框内容
                    this.onModalOpen(name);
                }
            },

            closeModal(name) {
                const modal = document.getElementById(`modal-${name}`);
                if (modal) modal.classList.remove('active');
            },

            onModalOpen(name) {
                const renderers = {
                    'projectManager': () => this.renderProjectManager(),
                    'settings': () => this.renderSettings(),
                    'aiStatus': () => this.renderAIStatus(),
                };
                if (renderers[name]) renderers[name]();
            },

            // ============================================
            // Toast通知
            // ============================================
            toast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3500);
            },

            // ============================================
            // 确认对话框
            // ============================================
            confirm(title, message) {
                return new Promise(resolve => {
                    document.getElementById('confirmTitle').textContent = title;
                    document.getElementById('confirmMessage').textContent = message;
                    this.openModal('confirm');
                    const okBtn = document.getElementById('confirmOk');
                    const handler = () => {
                        okBtn.removeEventListener('click', handler);
                        this.closeModal('confirm');
                        resolve(true);
                    };
                    okBtn.addEventListener('click', handler);
                });
            },

            // ============================================
            // 右键菜单
            // ============================================
            initContextMenu() {
                document.addEventListener('contextmenu', (e) => {
                    const editor = document.getElementById('editor');
                    if (!editor.contains(e.target)) return;
                    e.preventDefault();
                    const selection = window.getSelection().toString().trim();
                    const menu = document.getElementById('contextMenu');
                    const items = [
                        { icon: '▶', label: '从此处续写', action: () => this.aiContinue() },
                        { icon: '🔄', label: '重写选中内容', action: () => this.aiRewrite(), disabled: !selection },
                        { icon: '📐', label: '扩写选中内容', action: () => this.aiExpand(), disabled: !selection },
                        { divider: true },
                        { icon: '🎨', label: '为选中内容生图', action: () => this.generateImage(selection), disabled: !selection },
                        { icon: '📌', label: '标记伏笔', action: () => this.markForeshadow(selection), disabled: !selection },
                        { icon: '🔖', label: '创建分支点', action: () => this.createBranchPoint() },
                        { divider: true },
                        { icon: '📋', label: '复制', action: () => document.execCommand('copy') },
                        { icon: '✂️', label: '剪切', action: () => document.execCommand('cut') },
                    ];

                    menu.innerHTML = '';
                    const actionHandlers = [];

                    items.forEach(item => {
                        if (item.divider) {
                            menu.innerHTML += '<div class="context-menu-divider"></div>';
                            return;
                        }
                        const isDisabled = item.disabled;
                        const div = document.createElement('div');
                        div.className = 'context-menu-item';
                        if (isDisabled) { div.style.opacity = '0.4'; div.style.pointerEvents = 'none'; }
                        div.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
                        if (!isDisabled) {
                            div.addEventListener('click', () => {
                                item.action();
                                menu.classList.remove('active');
                            });
                        }
                        menu.appendChild(div);
                    });

                    menu.style.left = Math.min(e.pageX, window.innerWidth - 200) + 'px';
                    menu.style.top = Math.min(e.pageY, window.innerHeight - 300) + 'px';
                    menu.classList.add('active');
                });

                document.addEventListener('click', () => {
                    document.getElementById('contextMenu').classList.remove('active');
                });
            },

            // ============================================
            // 键盘快捷键
            // ============================================
            initKeyboard() {
                document.addEventListener('keydown', (e) => {
                    // Ctrl+Enter: 续写
                    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); this.aiContinue(); }
                    // Ctrl+S: 保存
                    if (e.ctrlKey && e.key === 's') { e.preventDefault(); this.saveCurrentWork(); }
                    // Ctrl+Shift+R: 重写
                    if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault(); this.aiRewrite(); }
                    // Escape: 关闭模态框
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
                    }
                });
            },

            // ============================================
            // 编辑器初始化
            // ============================================
            initEditor() {
                const editor = document.getElementById('editor');
                if (!editor) return;

                // Placeholder
                const updatePlaceholder = () => {
                    if (!editor.textContent.trim()) { editor.classList.add('empty'); }
                    else { editor.classList.remove('empty'); }
                    this.updateWordCount();
                };
                editor.addEventListener('input', updatePlaceholder);
                updatePlaceholder();

                // 粘贴纯文本
                editor.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
                    document.execCommand('insertText', false, text);
                });
            },

            // ============================================
            // 字数统计
            // ============================================
            updateWordCount() {
                const editor = document.getElementById('editor');
                if (!editor) return;
                const text = editor.textContent || '';
                const chars = text.replace(/\s/g, '').length;
                const tokens = Math.ceil(chars / 1.5); // 中文粗略估算
                document.getElementById('statusWords').textContent = `字数: ${chars.toLocaleString()}`;
                document.getElementById('statusTokens').textContent = `Token: ~${tokens.toLocaleString()}`;
            },

            // ============================================
            // 自动保存
            // ============================================
            initAutoSave() {
                this._autoSaveTimer = setInterval(() => {
                    if (this.state.currentProject && this.state.currentChapter) {
                        this.saveCurrentWork(true); // silent save
                    }
                }, 30000); // 30秒
            },

            async saveCurrentWork(silent = false) {
                const editor = document.getElementById('editor');
                if (!editor || !this.state.currentProject || !this.state.currentChapter) {
                    if (!silent) this.toast('没有打开的章节', 'warning');
                    return;
                }
                const content = editor.innerHTML;
                await DB.saveChapterContent( this.state.currentProject, this.state.currentChapter, content );
                if (!silent) this.toast('已保存', 'success');
            },

            // ============================================
            // 状态更新
            // ============================================
            updateStatus() {
                const proj = this.state.currentProject;
                document.getElementById('statusProject').textContent = proj ? `📁 ${proj.name || proj}` : '📁 未打开项目';
                const ch = this.state.currentChapter;
                document.getElementById('statusChapter').textContent = ch ? `📖 ${ch.title || ch}` : '📖 --';
            },

            // ============================================
            // 占位方法（后续段落实现）
            // ============================================
            async loadState() {
                try {
                    const saved = await DB.get('appState');
                    if (saved) Object.assign(this.state, saved);
                } catch(e) { console.warn('loadState:', e); }
            },
            renderSidebar() { /* 第2段实现 */ },
            renderPanel() { /* 第2段实现 */ },
            loadWorkspace() { /* 已在init中通过编辑器初始化处理 */ },
            loadOutlinePage() { /* 后续段落实现 */ },
            loadWorldbookPage() { /* 后续段落实现 */ },
            loadCharactersPage() { /* 后续段落实现 */ },
            loadChaptersPage() { /* 后续段落实现 */ },
            loadBranchesPage() { /* 后续段落实现 */ },
            loadNSFWLibPage() { /* 后续段落实现 */ },
            loadGalleryPage() { /* 后续段落实现 */ },
            loadAnalyticsPage() { /* 后续段落实现 */ },
            renderProjectManager() { /* 第2段实现 */ },
            renderSettings() { /* 第3段实现 */ },
            renderAIStatus() { /* 第3段实现 */ },
            sidebarAction() { /* 第2段实现 */ },
            aiContinue() { /* 第3段实现 */ },
            aiRewrite() { /* 第3段实现 */ },
            aiExpand() { /* 第3段实现 */ },
            abCompare() { /* 后续段落实现 */ },
            whatIf() { /* 后续段落实现 */ },
            generateImage() { /* 后续段落实现 */ },
            markForeshadow() { /* 后续段落实现 */ },
            createBranchPoint() { /* 后续段落实现 */ },
            createProject() { /* 第2段实现 */ },
            importProject() { /* 后续段落实现 */ },
        };

        // ============================================
        // [核心] IndexedDB 数据库层
        // ============================================
        const DB = {
            db: null,
            DB_NAME: 'EroMuseDB',
            DB_VERSION: 3,

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;

                        // 项目表
                        if (!db.objectStoreNames.contains('projects')) {
                            const ps = db.createObjectStore('projects', { keyPath: 'id' });
                            ps.createIndex('updatedAt', 'updatedAt');
                        }

                        // 章节表
                        if (!db.objectStoreNames.contains('chapters')) {
                            const cs = db.createObjectStore('chapters', { keyPath: 'id' });
                            cs.createIndex('projectId', 'projectId');
                            cs.createIndex('order', ['projectId', 'order']);
                        }

                        // 世界书条目表
                        if (!db.objectStoreNames.contains('worldEntries')) {
                            const ws = db.createObjectStore('worldEntries', { keyPath: 'id' });
                            ws.createIndex('projectId', 'projectId');
                            ws.createIndex('type', ['projectId', 'type']);
                        }

                        // 角色表
                        if (!db.objectStoreNames.contains('characters')) {
                            const chars = db.createObjectStore('characters', { keyPath: 'id' });
                            chars.createIndex('projectId', 'projectId');
                        }

                        // 记忆/摘要表
                        if (!db.objectStoreNames.contains('memories')) {
                            const ms = db.createObjectStore('memories', { keyPath: 'id' });
                            ms.createIndex('projectId', 'projectId');
                            ms.createIndex('type', ['projectId', 'type']);
                        }

                        // 分支表
                        if (!db.objectStoreNames.contains('branches')) {
                            const bs = db.createObjectStore('branches', { keyPath: 'id' });
                            bs.createIndex('projectId', 'projectId');
                        }

                        // 文风表
                        if (!db.objectStoreNames.contains('styles')) {
                            const ss = db.createObjectStore('styles', { keyPath: 'id' });
                            ss.createIndex('projectId', 'projectId');
                        }

                        // 大纲表
                        if (!db.objectStoreNames.contains('outlines')) {
                            const os = db.createObjectStore('outlines', { keyPath: 'id' });
                            os.createIndex('projectId', 'projectId');
                        }

                        // NSFW特化库
                        if (!db.objectStoreNames.contains('nsfwLib')) {
                            const ns = db.createObjectStore('nsfwLib', { keyPath: 'id' });
                            ns.createIndex('category', 'category');
                        }

                        // 图片库
                        if (!db.objectStoreNames.contains('images')) {
                            const imgs = db.createObjectStore('images', { keyPath: 'id' });
                            imgs.createIndex('projectId', 'projectId');
                            imgs.createIndex('chapterId', 'chapterId');
                        }

                        // 伏笔表
                        if (!db.objectStoreNames.contains('foreshadows')) {
                            const fs = db.createObjectStore('foreshadows', { keyPath: 'id' });
                            fs.createIndex('projectId', 'projectId');
                        }

                        // Prompt模板
                        if (!db.objectStoreNames.contains('promptTemplates')) {
                            const pt = db.createObjectStore('promptTemplates', { keyPath: 'id' });
                            pt.createIndex('category', 'category');
                        }

                        // 版本历史
                        if (!db.objectStoreNames.contains('versions')) {
                            const vs = db.createObjectStore('versions', { keyPath: 'id' });
                            vs.createIndex('targetId', 'targetId');
                        }

                        // 键值存储
                        if (!db.objectStoreNames.contains('kv')) {
                            db.createObjectStore('kv', { keyPath: 'key' });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };

                    request.onerror = (e) => reject(e.target.error);
                });
            },

            // 通用CRUD
            async put(store, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(store, 'readwrite');
                    tx.objectStore(store).put(data);
                    tx.oncomplete = () => resolve(data);
                    tx.onerror = (e) => reject(e.target.error);
                });
            },

            async get(store, key) {
                // kv存储的特殊处理
                if (arguments.length === 1 && typeof store === 'string' && !this.db.objectStoreNames.contains(store)) {
                    // 当做kv key使用
                    return this.getKV(store);
                }
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = (e) => reject(e.target.error);
                });
            },

            async getKV(key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('kv', 'readonly');
                    const req = tx.objectStore('kv').get(key);
                    req.onsuccess = () => resolve(req.result?.value);
                    req.onerror = (e) => reject(e.target.error);
                });
            },

            async setKV(key, value) {
                return this.put('kv', { key, value });
            },

            async getAll(store) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            },

            async getAllByIndex(store, indexName, value) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(store, 'readonly');
                    const index = tx.objectStore(store).index(indexName);
                    const req = index.getAll(value);
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            },

            async delete(store, key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(store, 'readwrite');
                    tx.objectStore(store).delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            },

            async clear(store) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(store, 'readwrite');
                    tx.objectStore(store).clear();
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                });
            },

            // 章节内容保存
            async saveChapterContent(projectId, chapterId, content) {
                const chapter = await this.get('chapters', typeof chapterId === 'string' ? chapterId : chapterId.id);
                if (chapter) {
                    chapter.content = content;
                    chapter.updatedAt = Date.now();
                    await this.put('chapters', chapter);
                }
            },

            // 生成唯一ID
            uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
            }
        };

        // ============================================
        // [核心] AI API 调用层
        // ============================================
        const AI = {
            // API配置存储
            configs: {
                deepseek: { name: 'DeepSeek', endpoint: 'https://api.deepseek.com/v1', key: '', model: 'deepseek-chat', enabled: false },
                claude: { name: 'Claude', endpoint: 'https://api.anthropic.com/v1', key: '', model: 'claude-sonnet-4-20250514', enabled: false },
                gemini: { name: 'Gemini', endpoint: 'https://generativelanguage.googleapis.com/v1beta', key: '', model: 'gemini-2.5-flash', enabled: false },
                grok: { name: 'Grok', endpoint: 'https://api.x.ai/v1', key: '', model: 'grok-3', enabled: false },
                newapi: { name: 'NewAPI (自定义)', endpoint: '', key: '', model: '', enabled: false },
                image: { name: '文生图API', endpoint: '', key: '', model: '', enabled: false, type: 'sd' },

            taskAssignment: {
                writing: 'deepseek', // 主线创作

                style: 'claude', // 文风分析
                review: 'claude', // 审稿
                image_prompt: 'deepseek', // 图像提示词生成
                image_gen: 'image', // 图像生成

            params: {
                temperature: 0.85,
                top_p: 0.92,
                max_tokens: 2048,
                frequency_penalty: 0.3,
                presence_penalty: 0.3,
            },

            // 加载配置
            async loadConfigs() {
                const saved = await DB.getKV('aiConfigs');
                if (saved) Object.assign(this.configs, saved);
                const savedTask = await DB.getKV('taskAssignment');
                if (savedTask) Object.assign(this.taskAssignment, savedTask);
                const savedParams = await DB.getKV('aiParams');
                if (savedParams) Object.assign(this.params, savedParams);
            },

            // 保存配置
            async saveConfigs() {
                await DB.setKV('aiConfigs', this.configs);
                await DB.setKV('taskAssignment', this.taskAssignment);
                await DB.setKV('aiParams', this.params);
            },

            // 获取指定任务的AI配置
            getConfigForTask(task) {
                const providerKey = this.taskAssignment[task] || 'deepseek';
                return { key: providerKey, ...this.configs[providerKey] };
            },

            // 统一调用入口
            async call(task, messages, options = {}) {
                const config = this.getConfigForTask(task);
                if (!config.key || !config.enabled) {
                    throw new Error(`任务"${task}"对应的AI (${config.name}) 未启用或未配置`);
                }

                const params = { ...this.params, ...options };

                // 根据provider类型选择调用方式
                const providerKey = this.taskAssignment[task];
                if (providerKey === 'claude') {
                    return this.callClaude(config, messages, params);
                } else if (providerKey === 'gemini') {
                    return this.callGemini(config, messages, params);
                } else {
                    // OpenAI兼容格式 (DeepSeek, Grok, NewAPI)
                    return this.callOpenAI(config, messages, params);
                }
            },

            // OpenAI兼容格式调用
            async callOpenAI(config, messages, params) {
                const response = await fetch(`${config.endpoint}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.key}`,
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages,
                        temperature: params.temperature,
                        top_p: params.top_p,
                        max_tokens: params.max_tokens,
                        frequency_penalty: params.frequency_penalty,
                        presence_penalty: params.presence_penalty,
                        stream: !!params.stream,
                    }),
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`API错误 (${response.status}): ${err}`);
                }

                if (params.stream) {
                    return this.handleStream(response);
                }

                const data = await response.json();
                return {
                    content: data.choices[0].message.content,
                    usage: data.usage,
                    model: data.model,
                };
            },

            // Claude API调用
            async callClaude(config, messages, params) {
                // 拆分system消息和对话消息
                let systemMsg = '';
                const chatMsgs = [];
                for (const msg of messages) {
                    if (msg.role === 'system') {
                        systemMsg += (systemMsg ? '\n' : '') + msg.content;
                    } else {
                        chatMsgs.push(msg);
                    }
                }

                const response = await fetch(`${config.endpoint}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': config.key,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true',
                    },
                    body: JSON.stringify({
                        model: config.model,
                        max_tokens: params.max_tokens,
                        system: systemMsg || undefined,
                        messages: chatMsgs.length ? chatMsgs : [{ role: 'user', content: '请继续创作' }],
                        temperature: params.temperature,
                        top_p: params.top_p,
                    }),
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`Claude API错误 (${response.status}): ${err}`);
                }

                const data = await response.json();
                return {
                    content: data.content[0].text,
                    usage: { prompt_tokens: data.usage.input_tokens, completion_tokens: data.usage.output_tokens },
                    model: data.model,
                };
            },

            // Gemini API调用
            async callGemini(config, messages, params) {
                // 转换为Gemini格式
                let systemInstruction = '';
                const contents = [];
                for (const msg of messages) {
                    if (msg.role === 'system') {
                        systemInstruction += (systemInstruction ? '\n' : '') + msg.content;
                    } else {
                        contents.push({
                            role: msg.role === 'assistant' ? 'model' : 'user',
                            parts: [{ text: msg.content }],
                        });
                    }
                }

                const url = `${config.endpoint}/models/${config.model}:generateContent?key=${config.key}`;
                const body = {
                    contents,
                    generationConfig: {
                        temperature: params.temperature,
                        topP: params.top_p,
                        maxOutputTokens: params.max_tokens,
                    },
                };
                if (systemInstruction) {
                    body.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`Gemini API错误 (${response.status}): ${err}`);
                }

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                return {
                    content: text,
                    usage: data.usageMetadata ? {
                        prompt_tokens: data.usageMetadata.promptTokenCount,
                        completion_tokens: data.usageMetadata.candidatesTokenCount,
                    } : {},
                    model: config.model,
                };
            },

            // 流式处理
            async *handleStream(response) {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('data: ') && trimmed !== 'data: [DONE]') {
                            try {
                                const json = JSON.parse(trimmed.slice(6));
                                const content = json.choices?.[0]?.delta?.content;
                                if (content) yield content;
                            } catch(e) { /* skip */ }
                        }
                    }
                }
            },

            // 流式调用（写入编辑器）
            async streamToEditor(task, messages, options = {}) {
                const config = this.getConfigForTask(task);
                if (!config.enabled) throw new Error(`${config.name} 未启用`);

                const editor = document.getElementById('editor');
                const marker = document.createElement('span');
                marker.className = 'ai-streaming-cursor';
                marker.style.cssText = 'border-right:2px solid var(--accent-primary);animation:pulse 1s infinite;padding-right:2px;';
                editor.appendChild(marker);

                try {
                    const result = await this.callOpenAI(config, messages, { ...this.params, ...options, stream: true });
                    let fullText = '';
                    for await (const chunk of result) {
                        fullText += chunk;
                        marker.textContent = fullText;
                    }
                    // 流结束后，用正常文本替换marker
                    const textNode = document.createTextNode(fullText);
                    marker.replaceWith(textNode);
                    return fullText;
                } catch (e) {
                    marker.remove();
                    throw e;
                }
            },

            // API健康检测
            async healthCheck(providerKey) {
                const config = this.configs[providerKey];
                if (!config || !config.key) return { status: 'unconfigured', latency: 0 };

                const start = Date.now();
                try {
                    if (providerKey === 'gemini') {
                        const url = `${config.endpoint}/models?key=${config.key}`;
                        const r = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(10000) });
                        return { status: r.ok ? 'online' : 'error', latency: Date.now() - start };
                    } else if (providerKey === 'claude') {
                        // Claude没有简单的health端点，用models列表
                        const r = await fetch(`${config.endpoint}/messages`, {
                            method: 'POST',
                            headers: {
                                'x-api-key': config.key,
                                'anthropic-version': '2023-06-01',
                                'Content-Type': 'application/json',
                                'anthropic-dangerous-direct-browser-access': 'true'
                            },
                            body: JSON.stringify({ model: config.model, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] }),
                            signal: AbortSignal.timeout(15000),
                        });
                        return { status: r.ok ? 'online' : 'error', latency: Date.now() - start };
                    } else {
                        // OpenAI兼容
                        const r = await fetch(`${config.endpoint}/models`, {
                            headers: { 'Authorization': `Bearer ${config.key}` },
                            signal: AbortSignal.timeout(10000),
                        });
                        return { status: r.ok ? 'online' : 'error', latency: Date.now() - start };
                    }
                } catch(e) {
                    return { status: 'offline', latency: Date.now() - start, error: e.message };
                }
            },
        };

        APP.initContextMenu = function() {

                e.preventDefault();
                const selection = window.getSelection().toString().trim();
                const menu = document.getElementById('contextMenu');
                const items = [
                    { icon: '▶', label: '从此处续写', action: () => APP.aiContinue() },
                    { icon: '🔄', label: '重写选中内容', action: () => APP.aiRewrite(), disabled: !selection },

                    { icon: '✂️', label: '剪切', action: () => document.execCommand('cut') },
                ];

                menu.innerHTML = '';
                const actionHandlers = [];
                items.forEach(item => {
                    if (item.divider) {
                        menu.innerHTML += '<div class="context-menu-divider"></div>';
                        return;
                    }
                    const isDisabled = item.disabled;
                    const div = document.createElement('div');
                    div.className = 'context-menu-item';
                    if (isDisabled) {
                        div.style.opacity = '0.4';
                        div.style.pointerEvents = 'none';
                    }
                    div.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
                    if (!isDisabled) {
                        div.addEventListener('click', () => {
                            item.action();
                            menu.classList.remove('active');
                        });
                    }
                    menu.appendChild(div);
                });

                menu.style.left = Math.min(e.pageX, window.innerWidth - 200) + 'px';
                menu.style.top = Math.min(e.pageY, window.innerHeight - 300) + 'px';
                menu.classList.add('active');
            });

            document.addEventListener('click', () => {
                document.getElementById('contextMenu').classList.remove('active');

        // ============================================================
        // [B] 章节管理系统
        // ============================================================
        APP.createChapter = async function(title) {
            if (!APP.state.currentProject) {
                APP.toast('请先打开一个项目', 'warning');
                return;
            }

            const projectId = APP.state.currentProject.id;
            const chapters = await DB.getAllByIndex('chapters', 'projectId', projectId);
            const maxOrder = chapters.reduce((max, c) => Math.max(max, c.order || 0), 0);
            const chapterNum = chapters.length + 1;

            const chapter = {
                id: DB.uid(),
                projectId,
                title: title || `第${chapterNum}章`,
                content: '',
                order: maxOrder + 1,
                branchId: APP.state.currentBranch || 'main',
                status: 'draft', // draft | writing | done
                rating: 'sfw', // sfw | r15 | r18 | r18g
                tags: [],
                wordCount: 0,
                summary: '',
                notes: '', // 作者笔记
                foreshadows: [], // 伏笔ID列表
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };

            await DB.put('chapters', chapter);

            // 更新项目统计
            APP.state.currentProject.stats.totalChapters = chapters.length + 1;
            APP.state.currentProject.updatedAt = Date.now();
            await DB.put('projects', APP.state.currentProject);

            APP.renderSidebar();
            await APP.loadChapter(chapter.id);
            APP.toast(`章节「${chapter.title}」已创建`, 'success');
            return chapter;
        };

        APP.loadChapter = async function(chapterId) {
            const chapter = await DB.get('chapters', chapterId);
            if (!chapter) {
                APP.toast('章节不存在', 'error');
                return;
            }

            // 保存当前章节
            if (APP.state.currentChapter) {
                await APP.saveCurrentWork(true);
            }

            APP.state.currentChapter = chapter;
            const editor = document.getElementById('editor');
            if (editor) {
                editor.innerHTML = chapter.content || '';
                editor.scrollTop = 0;
            }
            APP.updateStatus();
            APP.updateWordCount();
            APP.renderSidebar();
            // 更新右面板
            APP.renderPanel();
            document.getElementById('statusChapter').textContent = `📖 ${chapter.title}`;
        };

        APP.deleteChapter = async function(chapterId) {
            const chapter = await DB.get('chapters', chapterId);
            if (!chapter) return;

            const ok = await APP.confirm('删除章节', `确定要删除「${chapter.title}」吗？`);
            if (!ok) return;

            await DB.delete('chapters', chapterId);

            if (APP.state.currentChapter?.id === chapterId) {
                APP.state.currentChapter = null;
                const editor = document.getElementById('editor');
                if (editor) editor.innerHTML = '';
            }

            // 更新项目统计
            if (APP.state.currentProject) {
                const remaining = await DB.getAllByIndex('chapters', 'projectId', APP.state.currentProject.id);
                APP.state.currentProject.stats.totalChapters = remaining.length;
                await DB.put('projects', APP.state.currentProject);
            }

            APP.renderSidebar();
            APP.updateStatus();
            APP.toast('章节已删除', 'success');
        };

        APP.renameChapter = async function(chapterId) {
            const chapter = await DB.get('chapters', chapterId);
            if (!chapter) return;

            const newTitle = prompt('输入新标题：', chapter.title);
            if (!newTitle || newTitle === chapter.title) return;

            chapter.title = newTitle;
            chapter.updatedAt = Date.now();
            await DB.put('chapters', chapter);

            if (APP.state.currentChapter?.id === chapterId) {
                APP.state.currentChapter = chapter;
            }
            APP.renderSidebar();
            APP.updateStatus();
            APP.toast('章节已重命名', 'success');
        };

            chapter.rating = rating;
            chapter.updatedAt = Date.now();
            await DB.put('chapters', chapter);
            if (APP.state.currentChapter?.id === chapterId) {

        APP.renderChapterSidebar = async function(content, title, footer) {
            title.textContent = '📖 章节目录';
            const projectId = APP.state.currentProject.id;
            const chapters = await DB.getAllByIndex('chapters', 'projectId', projectId);

                            </div>
                        </div>
                        <div class="chapter-actions" style="display:flex;gap:2px;opacity:0;transition:opacity 0.15s">
                            <button class="btn-icon btn-sm" onclick="event.stopPropagation();APP.renameChapter('${ch.id}')" style="width:24px;height:24px;font-size:0.7rem" title="重命名">✏️</button>
                            <button class="btn-icon btn-sm" onclick="event.stopPropagation();APP.deleteChapter('${ch.id}')" style="width:24px;height:24px;font-size:0.7rem" title="删除">🗑️</button>

                // hover显示操作按钮
                content.querySelectorAll('.sidebar-item').forEach(item => {
                    const actions = item.querySelector('.chapter-actions');
                    if (actions) {
                        item.addEventListener('mouseenter', () => actions.style.opacity = '1');

                });

                // 拖拽排序
                APP.initChapterDrag(content);

            footer.innerHTML = `
                <button class="btn btn-sm btn-secondary" style="width:100%" onclick="APP.sidebarAction()">
                    + 新章节
                </button>`;
        };

        APP.initChapterDrag = function(container) {
            let dragItem = null;
            container.querySelectorAll('.sidebar-item[draggable]').forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    dragItem = item;
                    item.style.opacity = '0.4';
                    e.dataTransfer.effectAllowed = 'move';
                });
                item.addEventListener('dragend', () => {
                    item.style.opacity = '1';
                    dragItem = null;
                    container.querySelectorAll('.sidebar-item').forEach(i => i.style.borderTop = '');
                });
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    item.style.borderTop = '2px solid var(--accent-primary)';
                });
                item.addEventListener('dragleave', () => {
                    item.style.borderTop = '';
                });
                item.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    item.style.borderTop = '';
                    if (!dragItem || dragItem === item) return;
                    container.insertBefore(dragItem, item);
                    // 保存新顺序
                    const ids = [...container.querySelectorAll('.sidebar-item[data-chapter-id]')].map(i => i.dataset.chapterId);
                    await APP.reorderChapters(APP.state.currentProject.id, ids);
                });
            });
        };

        APP.renderMemoryItem = function(memory) {

        APP.addMemory = async function(type) {
            if (!APP.state.currentProject) return;
            const memory = {
                id: DB.uid(),
                projectId: APP.state.currentProject.id,
                type,
                title: '',
                content: '',
                keywords: [],
                chapterRange: null,
                priority: 5,
                enabled: true,
                createdAt: Date.now(),
            };

            // 快速输入
            const title = prompt(`新${type === 'permanent' ? '永久' : type === 'keyword' ? '关键词' : '滚动'}记忆标题：`);
            if (!title) return;
            memory.title = title;

            const content = prompt('记忆内容：');
            if (content) memory.content = content;

            if (type === 'keyword') {
                const kw = prompt('触发关键词（逗号分隔）：');
                if (kw) memory.keywords = kw.split(',').map(k => k.trim()).filter(Boolean);
            }

            await DB.put('memories', memory);
            APP.renderPanel();
            APP.toast('记忆已添加', 'success');
        };

        APP.editMemory = async function(memoryId) {

        APP.triggerSummarize = async function() {
            if (!APP.state.currentProject) return;
            APP.toast('正在生成章节摘要…', 'info');

            try {
                const projectId = APP.state.currentProject.id;
                const chapters = await DB.getAllByIndex('chapters', 'projectId', projectId);
                chapters.sort((a, b) => a.order - b.order);

                // 收集最近未总结的章节内容
                const existingRolling = (await DB.getAllByIndex('memories', 'projectId', projectId))
                    .filter(m => m.type === 'rolling');
                const summarizedChapterIds = new Set(existingRolling.flatMap(m => m.chapterIds || []));
                const unsummarized = chapters.filter(c => !summarizedChapterIds.has(c.id) && c.content);

                if (unsummarized.length === 0) {
                    APP.toast('没有需要总结的新章节', 'info');
                    return;
                }

                const combinedText = unsummarized.map(c => `【${c.title}】\n${c.content?.replace(/<[^>]*>/g, '') || ''}`).join('\n\n');

                const messages = [
                    { role: 'system', content: `你是一个小说摘要助手。请将以下章节内容总结为一段紧凑的摘要，保留关键情节转折、角色关系变化、重要事件。
要求：
1. 摘要控制在300-500字
2. 按时间线顺序
3. 标注重要的情感变化和关系进展
4. 如果有NSFW内容，简洁标注发生了什么即可
5. 用第三人称叙述` },
                    { role: 'user', content: `请总结以下章节内容：\n\n${combinedText.slice(0, 8000)}` }
                ];

                const result = await AI.call('summary', messages);

                const memory = {
                    id: DB.uid(),
                    projectId,
                    type: 'rolling',
                    title: `摘要: ${unsummarized.map(c => c.title).join(', ')}`,
                    content: result.content,
                    chapterIds: unsummarized.map(c => c.id),
                    priority: 7,
                    enabled: true,
                    createdAt: Date.now(),
                };

                await DB.put('memories', memory);
                APP.renderPanel();
                APP.toast('摘要生成完成', 'success');

        };

        APP._doStyleAnalysis = async function(text) {
            APP.toast('正在分析文风…', 'info');

            try {
                const messages = [
                    { role: 'system', content: `你是一个文学分析专家。请分析给定文本的写作风格，输出JSON格式，字段如下：
{
    "name": "风格简称(4字以内)",
    "description": "整体风格描述(100字以内)",
    "sentence_length": "句子长度特征",
    "vocabulary_level": "用词水平",
    "pov_style": "人称视角",
    "tense": "时态",
    "description_density": "描写密度",
    "dialogue_ratio": "对话占比",
    "sensory_focus": "感官描写偏好",
    "emotion_style": "情感表达方式",
    "rhythm": "节奏特征",
    "tags": ["标签1","标签2","标签3"],
    "prompt_instruction": "一段可以直接作为AI创作指令的文风描述(200字以内)"
}
只输出JSON，不要其他内容。` },
                    { role: 'user', content: `请分析以下文本的写作风格：\n\n${text.slice(0, 5000)}` }
                ];

                const result = await AI.call('style', messages);
                let parsed;
                try {
                    const jsonStr = result.content.replace(/```json?\n?/g, '').replace(/```/g, '').trim();
                    parsed = JSON.parse(jsonStr);
                } catch {
                    APP.toast('AI返回的格式无法解析，请重试', 'error');
                    return;
                }

                const style = {
                    id: DB.uid(),
                    projectId: APP.state.currentProject.id,
                    name: parsed.name || '未命名文风',
                    description: parsed.description || '',
                    analysis: parsed,
                    promptInstruction: parsed.prompt_instruction || '',
                    tags: parsed.tags || [],
                    active: false,
                    sceneType: 'normal',
                    createdAt: Date.now(),
                };

                await DB.put('styles', style);
                APP.renderPanel();
                APP.toast(`文风「${style.name}」分析完成`, 'success');
            } catch (e) {
                APP.toast('文风分析失败: ' + e.message, 'error');
            }
        };

        APP.clearAllData = async function() {
            const ok = await APP.confirm('清除所有数据', '此操作将删除所有项目、章节、设定！确定吗？');

            const ok2 = await APP.confirm('二次确认', '真的确定吗？此操作不可恢复！');
            if (!ok2) return;

            const stores = ['projects', 'chapters', 'worldEntries', 'characters', 'memories', 'branches', 'styles', 'outlines', 'nsfwLib', 'images', 'foreshadows', 'promptTemplates', 'versions', 'kv'];
            for (const store of stores) {
                try {
                    await DB.clear(store);
                } catch(e) {
                    console.warn('clear', store, e);
                }
            }

            APP.state.currentProject = null;
            APP.state.currentChapter = null;
            const editor = document.getElementById('editor');

            APP.updateStatus();
            APP.renderSidebar();
            APP.closeModal('settings');
            APP.toast('所有数据已清除', 'success');

        APP.exportAllData = async function() {
            const allData = {};
            const stores = ['projects', 'chapters', 'worldEntries', 'characters', 'memories', 'branches', 'styles', 'outlines', 'nsfwLib', 'images', 'foreshadows', 'promptTemplates', 'versions', 'kv'];
            for (const store of stores) {
                try {
                    allData[store] = await DB.getAll(store);
                } catch(e) {
                    allData[store] = [];
                }
            }

            const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `EroMuse_FullBackup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            APP.toast('全量备份导出成功', 'success');
        };

                    summary: `你是一个精准的文本摘要助手。请将给定内容总结为紧凑的摘要。
要求：保留关键情节转折、角色关系变化、重要事件，控制在300-500字。`,

要求：设定详实、内在逻辑一致、避免矛盾。`,
