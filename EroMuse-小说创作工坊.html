            if (!appearance && !ad.face && !ad.hair) return APP.toast('请先填写外貌信息', 'warning');

            APP.toast('正在生成视觉提示词…', 'info');

            try {
                const messages = [
                    { role: 'system', content: '将小说角色的外貌描述转换为Stable Diffusion/NovelAI可用的英文提示词。格式：逗号分隔的标签。只输出提示词，不要其他内容。' },
                    { role: 'user', content: `外貌：${appearance}\n面容：${ad.face}\n发型：${ad.hair}\n眼睛：${ad.eyes}\n体型：${ad.body}` }
                ];

                const result = await AI.call('image_prompt', messages);
                document.getElementById('ch_visualPrompt').value = result.content.trim();
                APP.toast('视觉提示词已生成', 'success');
            } catch (e) {
                APP.toast('失败: ' + e.message, 'error');
            }
        };

        APP.generateCharacterPortrait = async function() {
            const prompt = document.getElementById('ch_visualPrompt').value.trim();
            if (!prompt) return APP.toast('请先生成视觉提示词', 'warning');
            APP.toast('文生图功能将在后续版本实现', 'info');
        };

        APP.viewRelationshipMap = async function() {
            APP.toast('关系图可视化将在后续版本实现', 'info');
        };

        APP.aiExpandAllCharacters = async function() {
            APP.toast('批量AI完善将在后续版本实现', 'info');
        };

        // 占位
        APP.editStyle = APP.editStyle || function() {};
        APP.createWorldEntry = APP.createWorldEntry;
        APP.editWorldEntry = APP.editWorldEntry;
        APP.createCharacter = APP.createCharacter;
        APP.editCharacter = APP.editCharacter;
    </script>

    <!-- ============================================
         [5] 第5段代码: 大纲系统 + 分支系统 + 章节管理页 + 小修复
         ============================================ -->
    <script>
        // ============================================================
        // 第5段: 大纲系统 + 分支系统 + 章节管理页 + 小修复
        // ============================================================

        // ---- 修复: 提取关系列表渲染公用方法 ----
        APP._renderRelationsList = function() {
            const list = document.getElementById('charRelationsList');
            if (!list) return;

            const rels = APP._editingRelationships || [];
            list.innerHTML = rels.length === 0 ?
                '<div style="font-size:0.8rem;color:var(--text-muted);padding:8px">暂无关系</div>' :
                rels.map((r, i) => `
                    <div class="card" style="padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
                        <span style="flex:1">
                            <strong>${r.targetName}</strong>
                            <span style="color:var(--text-muted);margin:0 4px">—</span>
                            <span style="color:var(--accent-primary)">${r.type}</span>
                            ${r.detail ? `<span style="color:var(--text-secondary);font-size:0.8rem;margin-left:6px">${r.detail}</span>` : ''}
                        </span>
                        ${r.intimacy != null ? `<span class="badge badge-nsfw" style="font-size:0.65rem">亲密度:${r.intimacy}</span>` : ''}
                        <button class="btn-icon" style="width:20px;height:20px;font-size:0.65rem" onclick="APP._removeCharRelation(${i})">🗑️</button>
                    </div>
                `).join('');
        };

        APP._removeCharRelation = function(index) {
            APP._editingRelationships.splice(index, 1);
            APP._renderRelationsList();
        };

        // ============================================================
        // [A] 大纲系统
        // ============================================================
        APP.loadOutlinePage = async function() {
            const page = document.getElementById('page-outline');
            if (!page) return;

            const project = APP.state.currentProject;
            if (!project) {
                page.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">请先打开项目</div>';
                return;
            }

            const outlines = await DB.getAllByIndex('outlines', 'projectId', project.id);
            outlines.sort((a, b) => (a.order || 0) - (b.order || 0));

            const levelLabels = {
                0: '📕 总纲',
                1: '📗 卷纲',
                2: '📄 章纲',
                3: '📝 场景'
            };

            page.innerHTML = `
                <div class="content-toolbar">
                    <div class="toolbar-group">
                        <button class="btn-icon tooltip" data-tip="侧边栏" onclick="APP.toggleSidebarMobile()">☰</button>
                        <h3 style="font-size:1rem;font-weight:600;margin:0">📋 大纲规划</h3>
                    </div>
                    <div class="toolbar-group">
                        <span class="badge badge-accent">${outlines.length} 节点</span>
                    </div>
                    <div class="toolbar-spacer"></div>
                    <div class="toolbar-group">
                        <button class="btn btn-sm btn-ghost" onclick="APP.aiGenerateOutline()">🤖 AI生成大纲</button>
                        <button class="btn btn-sm btn-ghost" onclick="APP.aiRefineOutline()">✨ AI完善大纲</button>
                        <button class="btn btn-sm btn-ghost" onclick="APP.checkOutlineConsistency()">🔍 大纲-章节对照</button>
                        <button class="btn btn-sm btn-primary" onclick="APP.createOutlineNode()">+ 新节点</button>
                    </div>
                </div>

                <div style="flex:1;overflow-y:auto;padding:16px;display:flex;gap:16px">
                    <!-- 大纲树 -->
                    <div style="flex:1;min-width:0" id="outlineTreeContainer">
                        ${outlines.length === 0 ?
                            `<div style="text-align:center;padding:60px;color:var(--text-muted)">
                                <div style="font-size:3rem;margin-bottom:16px">📋</div>
                                <p>大纲为空</p>
                                <p style="font-size:0.82rem;margin-top:8px">从一个点子开始，让AI帮你构建完整的故事大纲</p>
                                <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
                                    <button class="btn btn-primary" onclick="APP.aiGenerateOutline()">🤖 AI生成大纲</button>
                                    <button class="btn btn-secondary" onclick="APP.createOutlineNode()">✏️ 手动创建</button>
                                </div>
                            </div>` :
                            APP._renderOutlineTree(outlines, levelLabels)
                        }
                    </div>

                    <!-- 节点详情面板 -->
                    <div style="width:350px;flex-shrink:0" id="outlineDetailPanel">
                        <div class="card" style="height:100%;display:flex;flex-direction:column">
                            <div class="card-header">
                                <span class="card-title">节点详情</span>
                            </div>
                            <div style="flex:1;overflow-y:auto;padding:4px" id="outlineDetail">
                                <div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.82rem">
                                    点击左侧大纲节点查看详情
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        APP._renderOutlineTree = function(outlines, levelLabels) {
            // 构建树形结构
            const tree = [];
            const map = {};

            outlines.forEach(o => {
                map[o.id] = { ...o, children: [] };
            });

            outlines.forEach(o => {
                if (o.parentId && map[o.parentId]) {
                    map[o.parentId].children.push(map[o.id]);
                } else {
                    tree.push(map[o.id]);
                }
            });

            const renderNode = (node, depth = 0) => {
                const indent = depth * 24;
                const hasChildren = node.children.length > 0;
                const statusIcon = node.status === 'done' ? '✅' : node.status === 'writing' ? '✏️' : '📄';
                const levelLabel = levelLabels[node.level] || `Lv${node.level}`;

                return `
                    <div class="outline-node" data-id="${node.id}" style="margin-left:${indent}px">
                        <div class="sidebar-item" onclick="APP.selectOutlineNode('${node.id}')" style="padding:10px 12px;margin-bottom:4px;border:1px solid transparent;border-radius:var(--radius-sm)">
                            <span style="cursor:pointer;margin-right:4px;font-size:0.8rem;width:16px;display:inline-block;text-align:center" onclick="event.stopPropagation();APP.toggleOutlineChildren('${node.id}')">
                                ${hasChildren ? '▼' : '·'}
                            </span>
                            <span style="margin-right:6px">${statusIcon}</span>
                            <div style="flex:1;min-width:0">
                                <div style="display:flex;align-items:center;gap:6px">
                                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${depth < 2 ? '600' : '400'}; font-size:${depth === 0 ? '0.95rem' : '0.85rem'}">${node.title}</span>
                                    <span class="badge badge-accent" style="font-size:0.6rem">${levelLabel}</span>
                                </div>
                                ${node.summary ?
                                    `<div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${node.summary}</div>` : ''
                                }
                            </div>
                            <div style="display:flex;gap:2px" class="outline-actions">
                                <button class="btn-icon" style="width:22px;height:22px;font-size:0.65rem" onclick="event.stopPropagation();APP.addChildOutlineNode('${node.id}')" title="添加子节点">➕</button>
                                <button class="btn-icon" style="width:22px;height:22px;font-size:0.65rem" onclick="event.stopPropagation();APP.deleteOutlineNode('${node.id}')" title="删除">🗑️</button>
                            </div>
                        </div>
                        <div class="outline-children" id="outline-children-${node.id}">
                            ${node.children.map(child => renderNode(child, depth + 1)).join('')}
                        </div>
                    </div>
                `;
            };

            return tree.map(node => renderNode(node, 0)).join('');
        };

        APP.toggleOutlineChildren = function(nodeId) {
            const el = document.getElementById(`outline-children-${nodeId}`);
            if (!el) return;

            const isHidden = el.style.display === 'none';
            el.style.display = isHidden ? '' : 'none';

            // 更新折叠图标
            const node = el.parentElement;
            const arrow = node?.querySelector('span[onclick*="toggleOutlineChildren"]');
            if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
        };

        APP.selectOutlineNode = async function(nodeId) {
            const node = await DB.get('outlines', nodeId);
            if (!node) return;

            APP._selectedOutlineNode = node;

            // 高亮
            document.querySelectorAll('.outline-node .sidebar-item').forEach(el => {
                el.style.borderColor = 'transparent';
            });

            const nodeEl = document.querySelector(`.outline-node[data-id="${nodeId}"] > .sidebar-item`);
            if (nodeEl) nodeEl.style.borderColor = 'var(--accent-primary)';

            const detail = document.getElementById('outlineDetail');
            if (!detail) return;

            const chapters = await DB.getAllByIndex('chapters', 'projectId', APP.state.currentProject.id);
            const linkedChapters = chapters.filter(c => node.linkedChapterIds?.includes(c.id));

            detail.innerHTML = `
                <div class="form-group">
                    <label>标题</label>
                    <input id="od_title" value="${node.title || ''}" onchange="APP._updateOutlineField('${nodeId}','title',this.value)" />
                </div>

                <div class="form-group">
                    <label>层级</label>
                    <div class="select-wrapper">
                        <select id="od_level" onchange="APP._updateOutlineField('${nodeId}','level',parseInt(this.value))">
                            <option value="0" ${node.level===0?'selected':''}>📕 总纲</option>
                            <option value="1" ${node.level===1?'selected':''}>📗 卷纲</option>
                            <option value="2" ${node.level===2?'selected':''}>📄 章纲</option>
                            <option value="3" ${node.level===3?'selected':''}>📝 场景</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>状态</label>
                    <div class="select-wrapper">
                        <select id="od_status" onchange="APP._updateOutlineField('${nodeId}','status',this.value)">
                            <option value="draft" ${node.status==='draft'?'selected':''}>📄 草稿</option>
                            <option value="writing" ${node.status==='writing'?'selected':''}>✏️ 进行中</option>
                            <option value="done" ${node.status==='done'?'selected':''}>✅ 完成</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>摘要（简短描述）</label>
                    <textarea id="od_summary" rows="2" onchange="APP._updateOutlineField('${nodeId}','summary',this.value)">${node.summary || ''}</textarea>
                </div>

                <div class="form-group">
                    <label>详细内容</label>
                    <textarea id="od_content" rows="8" onchange="APP._updateOutlineField('${nodeId}','content',this.value)">${node.content || ''}</textarea>
                </div>

                <div class="form-group">
                    <label>章节范围</label>
                    <div class="form-row">
                        <input type="number" placeholder="起始章" value="${node.chapterRange?.start || ''}" onchange="APP._updateOutlineChapterRange('${nodeId}','start',this.value)" />
                        <input type="number" placeholder="结束章" value="${node.chapterRange?.end || ''}" onchange="APP._updateOutlineChapterRange('${nodeId}','end',this.value)" />
                    </div>
                </div>

                <div class="form-group">
                    <label>关联章节</label>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">
                        ${linkedChapters.map(c => `<span class="badge badge-accent">${c.title}</span>`).join('') || '<span style="font-size:0.8rem;color:var(--text-muted)">无关联</span>'}
                    </div>
                </div>

                <div class="form-group">
                    <label>备注</label>
                    <textarea id="od_notes" rows="2" onchange="APP._updateOutlineField('${nodeId}','notes',this.value)">${node.notes || ''}</textarea>
                </div>

                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
                    <button class="btn btn-sm btn-secondary" onclick="APP.aiExpandOutlineNode('${nodeId}')">🤖 AI展开</button>
                    <button class="btn btn-sm btn-secondary" onclick="APP.aiCreateSubNodes('${nodeId}')">📂 AI生成子节点</button>
                </div>
            `;
        };

        APP._updateOutlineField = async function(nodeId, field, value) {
            const node = await DB.get('outlines', nodeId);
            if (!node) return;

            node[field] = value;
            node.updatedAt = Date.now();
            await DB.put('outlines', node);
        };

        APP._updateOutlineChapterRange = async function(nodeId, which, value) {
            const node = await DB.get('outlines', nodeId);
            if (!node) return;

            if (!node.chapterRange) node.chapterRange = {};
            node.chapterRange[which] = value ? parseInt(value) : null;
            node.updatedAt = Date.now();
            await DB.put('outlines', node);
        };

        APP.createOutlineNode = async function(parentId = null, level = null) {
            if (!APP.state.currentProject) return APP.toast('请先打开项目', 'warning');

            const title = prompt('节点标题：');
            if (!title) return;

            const outlines = await DB.getAllByIndex('outlines', 'projectId', APP.state.currentProject.id);
            const maxOrder = outlines.reduce((m, o) => Math.max(m, o.order || 0), 0);

            const node = {
                id: DB.uid(),
                projectId: APP.state.currentProject.id,
                parentId: parentId || null,
                title,
                summary: '',
                content: '',
                notes: '',
                level: level ?? (parentId ? ((await DB.get('outlines', parentId))?.level ?? 0) + 1 : 0),
                order: maxOrder + 1,
                status: 'draft',
                chapterRange: null,
                linkedChapterIds: [],
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };

            await DB.put('outlines', node);
            APP.loadOutlinePage();
            APP.renderSidebar();
            APP.toast(`节点「${title}」已创建`, 'success');
        };

        APP.addChildOutlineNode = function(parentId) {
            APP.createOutlineNode(parentId);
        };

        APP.deleteOutlineNode = async function(nodeId) {
            const node = await DB.get('outlines', nodeId);
            if (!node) return;

            const ok = await APP.confirm('删除节点', `删除「${node.title}」及其所有子节点？`);
            if (!ok) return;

            // 递归删除子节点
            const allOutlines = await DB.getAllByIndex('outlines', 'projectId', APP.state.currentProject.id);
            const toDelete = new Set([nodeId]);
            let changed = true;

            while (changed) {
                changed = false;
                allOutlines.forEach(o => {
                    if (o.parentId && toDelete.has(o.parentId) && !toDelete.has(o.id)) {
                        toDelete.add(o.id);
                        changed = true;
                    }
                });
            }

            for (const id of toDelete) {
                await DB.delete('outlines', id);
            }

            APP.loadOutlinePage();
            APP.renderSidebar();
