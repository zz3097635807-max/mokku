                return taskPrompts[task] || taskPrompts.writing;
            },

            /**
             * 获取永久记忆
             */
            async getPermanentMemories(projectId, config) {
                const memories = await DB.getAllByIndex('memories', 'projectId', projectId);
                const permanent = memories
                    .filter(m => m.type === 'permanent' && m.enabled !== false)
                    .sort((a, b) => (b.priority || 5) - (a.priority || 5));

                if (permanent.length === 0) return '';

                const maxItems = config.maxPermanent || 20;
                const selected = permanent.slice(0, maxItems);
                return selected.map(m => `[${m.title}] ${m.content}`).join('\n');
            },

            /**
             * 获取关键词触发的世界书条目
             */
            async getTriggeredWorldEntries(projectId, currentText, config) {
                if (!config.autoActivate) return '';

                const entries = await DB.getAllByIndex('worldEntries', 'projectId', projectId);
                const enabledEntries = entries.filter(e => e.enabled !== false);
                const textLower = currentText.toLowerCase();

                // 第一轮：直接关键词匹配
                const triggered = new Set();

                const triggerEntry = (entry) => {
                    if (triggered.has(entry.id)) return;
                    triggered.add(entry.id);

                    // 递归扫描：该条目内容中是否包含其他条目的关键词
                    if (config.recursiveScan) {
                        const entryTextLower = (entry.content || '').toLowerCase();
                        enabledEntries.forEach(other => {
                            if (other.id === entry.id || triggered.has(other.id)) return;
                            const otherKeywords = other.keywords || [];
                            if (otherKeywords.some(kw => entryTextLower.includes(kw.toLowerCase()))) {
                                triggerEntry(other);
                            }
                        });
                    }
                };

                enabledEntries.forEach(entry => {
                    const keywords = entry.keywords || [];
                    if (keywords.length === 0) return;

                    // 概率触发
                    const triggerChance = entry.triggerChance ?? 100;
                    if (triggerChance < 100 && Math.random() * 100 > triggerChance) return;

                    // 章节范围检查
                    if (entry.chapterRange) {
                        const currentOrder = APP.state.currentChapter?.order || 0;
                        if (entry.chapterRange.start && currentOrder < entry.chapterRange.start) return;
                        if (entry.chapterRange.end && currentOrder > entry.chapterRange.end) return;
                    }

                    if (keywords.some(kw => textLower.includes(kw.toLowerCase()))) {
                        triggerEntry(entry);
                    }
                });

                if (triggered.size === 0) return '';

                // 按优先级排序，控制token预算
                const triggeredEntries = enabledEntries
                    .filter(e => triggered.has(e.id))
                    .sort((a, b) => (b.priority || 5) - (a.priority || 5));

                let result = '';
                let tokenCount = 0;
                const budget = config.tokenBudget || 1500;

                for (const entry of triggeredEntries) {
                    const entryText = `[${entry.name}(${entry.type || '设定'})] ${entry.content}\n`;
                    const tokens = Math.ceil(entryText.length / 1.5);
                    if (tokenCount + tokens > budget) break;
                    result += entryText;
                    tokenCount += tokens;
                }

                return result;
            },

            /**
             * 获取滚动摘要
             */
            async getRollingSummaries(projectId, config) {
                const memories = await DB.getAllByIndex('memories', 'projectId', projectId);
                const rolling = memories
                    .filter(m => m.type === 'rolling' && m.enabled !== false)
                    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

                if (rolling.length === 0) return '';

                const maxItems = config.maxRolling || 10;
                const selected = rolling.slice(-maxItems);
                return selected.map(m => m.content).join('\n---\n');
            },

            /**
             * 获取文风指令
             */
            async getStyleInstruction(projectId, task, sceneType) {
                const styles = await DB.getAllByIndex('styles', 'projectId', projectId);
                const activeStyles = styles.filter(s => s.active);
                if (activeStyles.length === 0) return '';

                // 检查场景特定文风
                const project = APP.state.currentProject;
                const sceneStyles = project?.settings?.sceneStyles || {};
                const sceneTypeKey = sceneType || (task === 'nsfw' ? 'nsfw' : 'normal');

                if (sceneStyles[sceneTypeKey]) {
                    const sceneStyle = styles.find(s => s.id === sceneStyles[sceneTypeKey]);
                    if (sceneStyle && sceneStyle.promptInstruction) {
                        return sceneStyle.promptInstruction;
                    }
                }

                // 使用通用激活文风
                return activeStyles
                    .map(s => s.promptInstruction || s.description || '')
                    .filter(Boolean)
                    .join('\n');
            },

            /**
             * 获取大纲上下文
             */
            async getOutlineContext(projectId, chapter) {
                const outlines = await DB.getAllByIndex('outlines', 'projectId', projectId);
                if (outlines.length === 0) return '';

                outlines.sort((a, b) => (a.order || 0) - (b.order || 0));

                // 找到当前章节对应的大纲节点
                const currentOrder = chapter?.order || 0;
                const relevant = outlines.filter(o => {
                    if (o.chapterRange) {
                        return currentOrder >= (o.chapterRange.start || 0) &&
                               currentOrder <= (o.chapterRange.end || 999);
                    }
                    return true;
                });

                if (relevant.length === 0) return '';

                // 只取顶层和当前相关的
                const topLevel = relevant.filter(o => o.level === 0).slice(0, 1);
                const midLevel = relevant.filter(o => o.level === 1).slice(0, 2);
                const detailLevel = relevant.filter(o => o.level === 2).slice(0, 3);

                const parts = [];
                topLevel.forEach(o => parts.push(`【总纲】${o.title}: ${o.content || ''}`));
                midLevel.forEach(o => parts.push(`【卷纲】${o.title}: ${o.content || ''}`));
                detailLevel.forEach(o => parts.push(`【章纲】${o.title}: ${o.content || ''}`));

                return parts.join('\n').slice(0, 1500);
            },

            /**
             * 获取当前文本中出现的角色信息
             */
            async getCharacterContext(projectId, currentText) {
                const characters = await DB.getAllByIndex('characters', 'projectId', projectId);
                if (characters.length === 0 || !currentText) return '';

                const textLower = currentText.toLowerCase();
                const mentioned = characters.filter(ch => {
                    const names = [ch.name, ...(ch.aliases || [])].filter(Boolean);
                    return names.some(n => textLower.includes(n.toLowerCase()));
                });

                if (mentioned.length === 0) return '';

                return mentioned.map(ch => {
                    const parts = [`[${ch.name}]`];
                    if (ch.role) parts.push(`身份: ${ch.role}`);
                    if (ch.appearance) parts.push(`外貌: ${ch.appearance}`);
                    if (ch.personality) parts.push(`性格: ${ch.personality}`);
                    if (ch.speechStyle) parts.push(`说话方式: ${ch.speechStyle}`);
                    if (ch.nsfwTraits) parts.push(`亲密特征: ${ch.nsfwTraits}`);
                    return parts.join(' | ');
                }).join('\n');
            },

            /**

            calcStats(messages) {
                const stats = { total: 0, system: 0, context: 0, current: 0 };
                messages.forEach(m => {
                    const tokens = Math.ceil((m.content || '').length / 1.5);
                    stats.total += tokens;
                    if (m.role === 'system') stats.system += tokens;
                    else if (m.role === 'assistant') stats.current += tokens;
                    else stats.context += tokens;
                });
                return stats;
            },

            lastContextStats: null,

            /**

             */
            updateContextDisplay() {
                if (!this.lastContextStats) return;

                    'ctx_world_tk': '',
                    'ctx_rolling_tk': '',
                    'ctx_current_tk': `~${s.current}`,
                    'ctx_total_tk': `~${s.total}`
                };

                Object.entries(ids).forEach(([id, val]) => {
                    const el = document.getElementById(id);
                    if (el && val) el.textContent = val;
                });

                const bar = document.getElementById('ctx_bar');
                if (bar) {
                    const maxTokens = AI.params.max_tokens * 30; // 粗估模型上下文窗口
                    const pct = Math.min(100, (s.total / maxTokens) * 100);
                    bar.style.width = pct + '%';
                    bar.style.background = pct > 80 ? 'var(--accent-danger)' :
                                           pct > 60 ? 'var(--accent-warning)' : 'var(--accent-primary)';
                }
            }
        };

        // ============================================================
        // [E] 流式输出到编辑器（重构）
        // ============================================================
        APP._streamToEditor = async function(messages, task) {
            const config = AI.getConfigForTask(task);
            if (!config || !config.enabled) {
                throw new Error(`任务"${task}"对应的AI (${config.name}) 未启用`);
            }

            const editor = document.getElementById('editor');

            // 创建流式输出标记
            const streamContainer = document.createElement('span');
            streamContainer.className = 'ai-stream-output';
            streamContainer.style.cssText = 'border-right:2px solid var(--accent-primary);padding-right:2px;animation:pulse 1s infinite;';

            // 添加换行和容器
            editor.appendChild(document.createTextNode('\n'));
            editor.appendChild(streamContainer);
            editor.scrollTop = editor.scrollHeight;

            let fullText = '';

            try {
                // 使用OpenAI兼容格式的流式调用
                const providerKey = AI.taskAssignment[task] || 'deepseek';

                if (providerKey === 'claude') {
                    // Claude 非流式调用后模拟逐字输出
                    const result = await AI.callClaude(config, messages, AI.params);
                    fullText = result.content;
                    await APP._simulateStream(streamContainer, fullText, editor);
                } else if (providerKey === 'gemini') {
                    // Gemini 非流式调用后模拟逐字输出
                    const result = await AI.callGemini(config, messages, AI.params);
                    fullText = result.content;
                    await APP._simulateStream(streamContainer, fullText, editor);
                } else {
                    // OpenAI兼容格式 - 真正的SSE流式
                    const response = await fetch(`${config.endpoint}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${config.key}`,
                        },
                        body: JSON.stringify({
                            model: config.model,
                            messages,
                            temperature: AI.params.temperature,
                            top_p: AI.params.top_p,
                            max_tokens: AI.params.max_tokens,
                            frequency_penalty: AI.params.frequency_penalty,
                            presence_penalty: AI.params.presence_penalty,
                            stream: true,
                        }),
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`API错误 (${response.status}): ${errText}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || !trimmed.startsWith('data: ')) continue;
                            if (trimmed === 'data: [DONE]') continue;

                            try {
                                const json = JSON.parse(trimmed.slice(6));
                                const delta = json.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullText += delta;
                                    streamContainer.textContent = fullText;
                                    editor.scrollTop = editor.scrollHeight;
                                }
                            } catch (parseErr) {
                                // 跳过解析失败的行
                            }
                        }
                    }
                }
            } finally {
                // 流结束，移除光标效果
                streamContainer.style.borderRight = 'none';
                streamContainer.style.paddingRight = '0';
                streamContainer.style.animation = 'none';
                streamContainer.className = '';
            }

            // 更新token统计
            const usage = {
                prompt_tokens: Math.ceil(messages.reduce((s, m) => s + (m.content || '').length, 0) / 1.5),
                completion_tokens: Math.ceil(fullText.length / 1.5),
            };
            APP._updateCostEstimate(usage, task);

            return fullText;
        };

        /**
         * 模拟流式输出效果（用于非流式API）
         */
        APP._simulateStream = async function(container, text, editor) {
            const chunkSize = 3; // 每次显示3个字符
            const delay = 20; // 每次20ms

            for (let i = 0; i < text.length; i += chunkSize) {
                container.textContent = text.slice(0, i + chunkSize);
                editor.scrollTop = editor.scrollHeight;
                await new Promise(r => setTimeout(r, delay));
            }
            container.textContent = text;
        };

        // ============================================================
        // [F] 写作状态管理
        // ============================================================
        APP._setWritingState = function(isWriting) {
            APP.state.isWriting = isWriting;

            // 禁用/启用写作按钮
            const btns = document.querySelectorAll('.content-toolbar .btn');
            btns.forEach(btn => {
                if (isWriting) {
                    btn.dataset.wasDisabled = btn.disabled;
                    btn.disabled = true;
                } else {
                    btn.disabled = btn.dataset.wasDisabled === 'true';
                    delete btn.dataset.wasDisabled;
                }
            });

            // 更新状态栏
            document.getElementById('statusApi').textContent = isWriting ? 'API: 生成中…' : 'API: 空闲';
        };

        // ============================================================
        // [G] 费用估算
        // ============================================================
        APP._updateCostEstimate = function(usage, task) {
            const providerKey = AI.taskAssignment[task] || 'deepseek';

            // 粗略定价 (每百万token, 单位RMB)
            const pricing = {
                deepseek: { input: 1, output: 2 },
                claude: { input: 21, output: 105 },
                gemini: { input: 2.5, output: 10 },
                grok: { input: 15, output: 75 },
                newapi: { input: 5, output: 15 },
            };

            const price = pricing[providerKey] || pricing.deepseek;
            const inputCost = (usage.prompt_tokens / 1000000) * price.input;
            const outputCost = (usage.completion_tokens / 1000000) * price.output;
            const totalCost = inputCost + outputCost;

            if (APP.state.currentProject) {
                APP.state.currentProject.stats.totalCost = (APP.state.currentProject.stats.totalCost || 0) + totalCost;
                DB.put('projects', APP.state.currentProject);
            }

            document.getElementById('statusCost').textContent = `费用: ¥${(APP.state.currentProject?.stats?.totalCost || 0).toFixed(4)}`;
        };

        APP._checkAutoSummarize = async function() {
            if (!APP.state.currentProject) return;

            const config = APP.state.currentProject.settings?.memoryConfig || {};
            if (!config.autoSummarize) return;

            const projectId = APP.state.currentProject.id;
            const chapters = await DB.getAllByIndex('chapters', 'projectId', projectId);
            const memories = await DB.getAllByIndex('memories', 'projectId', projectId);

            const rollingMemories = memories.filter(m => m.type === 'rolling');
            const summarizedChapterIds = new Set(rollingMemories.flatMap(m => m.chapterIds || []));
            const unsummarized = chapters.filter(c => !summarizedChapterIds.has(c.id) && c.content);

            const threshold = config.summarizeEvery || 3;

            if (unsummarized.length >= threshold) {
                APP.toast(`已积累${unsummarized.length}章未总结内容，正在自动生成摘要…`, 'info');
                await APP.triggerSummarize();
            }
        };

        // [K] 伏笔标记系统
        // ============================================================
        APP.markForeshadow = async function(selectedText) {
            if (!selectedText) {
                const sel = window.getSelection().toString().trim();
                if (!sel) {
                    APP.toast('请先选中要标记为伏笔的文本', 'warning');
                    return;
                }
                selectedText = sel;
            }

            const description = prompt('伏笔描述（这个伏笔预示着什么？）：');
            if (!description) return;

            const foreshadow = {
                id: DB.uid(),
                projectId: APP.state.currentProject.id,
                chapterId: APP.state.currentChapter?.id,
                chapterTitle: APP.state.currentChapter?.title || '',
                text: selectedText.slice(0, 200),
                description,
                status: 'planted', // planted | recalled | abandoned
                plantedAt: Date.now(),
                recalledAt: null,
                recallChapterId: null,
                priority: 5,
            };

            await DB.put('foreshadows', foreshadow);
            APP.toast('伏笔已标记 📌', 'success');

            // 检查并提醒未回收的伏笔
            await APP._checkForeshadows();
        };

        APP._checkForeshadows = async function() {
            if (!APP.state.currentProject) return;

            const foreshadows = await DB.getAllByIndex('foreshadows', 'projectId', APP.state.currentProject.id);
            const planted = foreshadows.filter(f => f.status === 'planted');

            if (planted.length > 0) {
                const oldest = planted.sort((a, b) => a.plantedAt - b.plantedAt)[0];
                const chaptersAgo = (APP.state.currentChapter?.order || 0) - (oldest.chapterOrder || 0);
                if (chaptersAgo >= 5) {
                    APP.toast(`📌 伏笔「${oldest.description?.slice(0, 20)}…」已埋下${chaptersAgo}章，是否需要回收？`, 'warning');
                }
            }
        };

        // ============================================================
        // [L] AI自我审稿
        // ============================================================
        APP.aiReview = async function() {
            if (!APP.state.currentProject || !APP.state.currentChapter) {
                APP.toast('请先打开章节', 'warning');
                return;
            }

            const editor = document.getElementById('editor');
            const text = editor?.innerText || '';

            if (text.length < 100) {
                APP.toast('内容太短，无法审稿', 'warning');
                return;
            }

            let overlay = document.getElementById('modal-review');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'modal-review';
                overlay.innerHTML = `
                    <div class="modal" style="max-width:700px;height:75vh">
                        <div class="modal-header">
                            <h3>📖 AI审稿报告</h3>
                            <button class="btn-icon" onclick="APP.closeModal('review')">✕</button>
                        </div>
                        <div class="modal-body" id="reviewBody" style="overflow-y:auto">
                            <div style="text-align:center;padding:40px">
                                <div class="loading-spinner" style="margin:0 auto"></div>
                                <div style="margin-top:12px;color:var(--text-muted)">正在审稿…</div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="APP.closeModal('review')">关闭</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
            }

            APP.openModal('review');

            try {
                const messages = await ContextEngine.build('review', `请审查以下章节内容并给出详细的编辑意见：

${text.slice(0, 8000)}

请从以下维度评审：
1. 🎯 **总体评分** (1-10) 及总评
2. 📝 **文笔质量**：用词、句式、修辞
3. 📖 **情节逻辑**：是否有逻辑漏洞或不合理处
4. 👤 **角色一致性**：角色行为是否符合其设定
5. ⏱️ **节奏控制**：是否有拖沓或仓促之处
6. 🔄 **重复问题**：是否有重复的用词或描写
7. 💡 **具体改进建议**：列出3-5个最重要的修改建议
8. ✨ **亮点**：文中做得好的地方`);

                const result = await AI.call('review', messages, { max_tokens: 3000 });

                document.getElementById('reviewBody').innerHTML = `
                    <div style="white-space:pre-wrap;word-break:break-word;line-height:1.8;font-size:0.9rem">
                        ${result.content.replace(/\n/g, '<br>')}
                    </div>`;

            } catch (e) {
                document.getElementById('reviewBody').innerHTML = `
                    <div style="color:var(--accent-danger);padding:20px;text-align:center">审稿失败: ${e.message}</div>`;
            }
        };

        // ============================================================
        // [M] 一致性检查器
        // ============================================================
        APP.consistencyCheck = async function() {
            if (!APP.state.currentProject) {
                APP.toast('请先打开项目', 'warning');
                return;
            }

            APP.toast('正在进行一致性检查…', 'info');

            const projectId = APP.state.currentProject.id;
            const chapters = await DB.getAllByIndex('chapters', 'projectId', projectId);
            chapters.sort((a, b) => a.order - b.order);

            const characters = await DB.getAllByIndex('characters', 'projectId', projectId);
            const worldEntries = await DB.getAllByIndex('worldEntries', 'projectId', projectId);

            // 收集全文（截断保护）
            let fullText = chapters.map(c => {
                const text = (c.content || '').replace(/<[^>]*>/g, '');
                return `【${c.title}】\n${text}`;
            }).join('\n\n');

            if (fullText.length > 12000) {
                fullText = fullText.slice(0, 12000) + '\n...(已截断)';
            }

            // 角色设定摘要
            const charSummary = characters.map(c =>
                `${c.name}: ${c.appearance || ''} | ${c.personality || ''}`
            ).join('\n');

            // 世界设定摘要
            const worldSummary = worldEntries.slice(0, 20).map(e =>
                `${e.name}: ${(e.content || '').slice(0, 100)}`
            ).join('\n');

            try {
                const messages = [
                    { role: 'system', content: `你是一个专业的小说一致性审核员。请仔细检查以下小说内容，找出前后矛盾和不一致之处。` },
                    { role: 'user', content: `【角色设定】
${charSummary || '暂无'}

【世界设定】
${worldSummary || '暂无'}

【小说全文】
${fullText}

请检查并报告：
1. 🔍 **角色描写矛盾**：外貌、性格、习惯前后不一致
2. 📍 **地名/人名不一致**：拼写或称呼变化
3. ⏰ **时间线矛盾**：事件顺序不合理
4. 🏠 **场景矛盾**：环境描写前后不符
5. 💬 **对话风格偏移**：角色说话方式突变
6. 📊 **一致性评分**：总体一致性评分(1-10)

只列出确定的问题，不要猜测。如果没有发现问题，直接说明。` }
                ];

                const result = await AI.call('review', messages, { max_tokens: 3000 });

                // 显示结果
                let overlay = document.getElementById('modal-consistency');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.className = 'modal-overlay';
                    overlay.id = 'modal-consistency';
                    overlay.innerHTML = `
                        <div class="modal" style="max-width:700px;height:75vh">
                            <div class="modal-header">
                                <h3>🔍 一致性检查报告</h3>
                                <button class="btn-icon" onclick="APP.closeModal('consistency')">✕</button>
                            </div>
                            <div class="modal-body" id="consistencyBody" style="overflow-y:auto"></div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" onclick="APP.closeModal('consistency')">关闭</button>
                            </div>
                        </div>`;
                    document.body.appendChild(overlay);
                }

                document.getElementById('consistencyBody').innerHTML = `
                    <div style="white-space:pre-wrap;word-break:break-word;line-height:1.8;font-size:0.9rem">
                        ${result.content.replace(/\n/g, '<br>')}
                    </div>`;

                APP.openModal('consistency');

            } catch (e) {
                APP.toast('一致性检查失败: ' + e.message, 'error');
            }
        };

        // ============================================================
        // [N] 工具栏增强 — 添加更多按钮
        // ============================================================
        APP._enhanceToolbar = function() {
            const toolbar = document.querySelector('#page-workspace .content-toolbar');
            if (!toolbar || toolbar.dataset.enhanced) return;
            toolbar.dataset.enhanced = 'true';

            // 在已有按钮组后面插入更多功能
            const spacer = toolbar.querySelector('.toolbar-spacer');
            if (!spacer) return;

            const extraGroup = document.createElement('div');
            extraGroup.className = 'toolbar-group';
            extraGroup.innerHTML = `
                <button class="btn btn-sm btn-ghost" onclick="APP.aiReview()">📖 审稿</button>
                <button class="btn btn-sm btn-ghost" onclick="APP.consistencyCheck()">🔍 一致性</button>
            `;
            spacer.before(extraGroup);
        };

        // 在init完成后增强工具栏
        const _originalInit = APP.init;
        APP.init = async function() {
            await _originalInit.call(this);
            APP._enhanceToolbar();
        };
    </script>

    <!-- ============================================
         [4] 第4段代码: 世界书完整系统 + 角色管理 + AI迭代 + Bug修复
         ============================================ -->
    <script>
        // ============================================================
        // 第4段: 世界书完整系统 + 角色管理 + AI迭代 + Bug修复
        // ============================================================

        // ============================================================
        // [A] 世界书完整管理系统
        // ============================================================
        APP.loadWorldbookPage = async function() {
            const page = document.getElementById('page-worldbook');
            if (!page) return;

            const project = APP.state.currentProject;
            if (!project) {
                page.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">请先打开项目</div>';
                return;
            }

            const entries = await DB.getAllByIndex('worldEntries', 'projectId', project.id);

            const typeLabels = {
                character: { icon: '👤', label: '角色' },
                location: { icon: '📍', label: '地点' },
                item: { icon: '🔮', label: '物品' },
                event: { icon: '⚡', label: '事件' },
                rule: { icon: '📜', label: '规则' },
                organization: { icon: '🏛️', label: '组织' },
                lore: { icon: '📚', label: '传说' },
                other: { icon: '📌', label: '其他' },
            };

            // 分组
            const grouped = {};
            entries.forEach(e => {
                const t = e.type || 'other';
                if (!grouped[t]) grouped[t] = [];
                grouped[t].push(e);
            });

            const totalTokens = entries.reduce((s, e) => s + Math.ceil(((e.content || '').length) / 1.5), 0);
            const activeCount = entries.filter(e => e.enabled !== false).length;

            page.innerHTML = `
                <div class="content-toolbar">
                    <div class="toolbar-group">
                        <button class="btn-icon tooltip" data-tip="侧边栏" onclick="APP.toggleSidebarMobile()">☰</button>
                        <h3 style="font-size:1rem;font-weight:600;margin:0">🌍 世界书</h3>
                    </div>
                    <div class="toolbar-group">
                        <span class="badge badge-accent">${entries.length} 条目</span>
                        <span class="badge badge-success">${activeCount} 激活</span>
                        <span class="badge badge-warning">~${totalTokens} tk</span>
                    </div>
                    <div class="toolbar-spacer"></div>
                    <div class="toolbar-group">
                        <button class="btn btn-sm btn-ghost" onclick="APP.aiIterateWorldbook()">🤖 AI迭代</button>
                        <button class="btn btn-sm btn-ghost" onclick="APP.searchWorldInfo()">🔍 搜索补全</button>
                        <button class="btn btn-sm btn-ghost" onclick="APP.importWorldbook()">📥 导入</button>
                        <button class="btn btn-sm btn-ghost" onclick="APP.exportWorldbook()">📤 导出</button>
                        <button class="btn btn-sm btn-primary" onclick="APP.createWorldEntry()">+ 新条目</button>
                    </div>
                </div>

                <div style="flex:1;overflow-y:auto;padding:16px">
                    <!-- 类型筛选器 -->
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
                        <button class="btn btn-sm btn-secondary wb-filter active" data-type="all" onclick="APP.filterWorldEntries('all', this)">
                            全部 (${entries.length})
                        </button>
                        ${Object.entries(typeLabels).map(([type, info]) => {
                            const count = (grouped[type] || []).length;
                            if (count === 0) return '';
                            return `<button class="btn btn-sm btn-secondary wb-filter" data-type="${type}" onclick="APP.filterWorldEntries('${type}', this)">
                                ${info.icon} ${info.label} (${count})
                            </button>`;
                        }).join('')}
                    </div>

                    <!-- 条目网格 -->
                    <div id="worldEntriesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px">
                        ${entries.length === 0 ?
                            `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)">
                                <div style="font-size:3rem;margin-bottom:16px">🌍</div>
                                <p>世界书为空</p>
                                <p style="font-size:0.82rem;margin-top:8px">创建条目来定义你的世界观、角色、地点和事件</p>
                                <button class="btn btn-primary" style="margin-top:16px" onclick="APP.createWorldEntry()">+ 创建第一个条目</button>
                            </div>` :
                            entries.map(e => APP._renderWorldEntryCard(e, typeLabels)).join('')
                        }
                    </div>
                </div>
            `;
        };

        APP._renderWorldEntryCard = function(entry, typeLabels) {
            const info = typeLabels[entry.type] || typeLabels.other;
            const isEnabled = entry.enabled !== false;
            const tokenEst = Math.ceil(((entry.content || '').length) / 1.5);
            const keywords = (entry.keywords || []).slice(0, 5);
            const hasVersions = (entry.versionHistory || []).length > 0;

            return `
                <div class="card wb-entry-card" data-type="${entry.type || 'other'}" data-id="${entry.id}" style="${!isEnabled ? 'opacity:0.5' : ''}">
                    <div class="card-header" style="margin-bottom:8px;padding-bottom:8px">
                        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
                            <span>${info.icon}</span>
                            <span class="card-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${entry.name}</span>
                            ${hasVersions ? '<span style="font-size:0.7rem;color:var(--accent-info)" title="有版本历史">📋</span>' : ''}
                        </div>
                        <div style="display:flex;gap:4px;align-items:center">
                            <span class="badge badge-accent" style="font-size:0.65rem">${info.label}</span>
                            <label class="toggle-switch" style="width:32px;height:18px">
                                <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="APP.toggleWorldEntry('${entry.id}', this.checked)" />
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <div style="font-size:0.8rem;color:var(--text-secondary);line-height:1.6;max-height:80px;overflow:hidden;margin-bottom:8px">
                        ${(entry.content || '').slice(0, 200)}${(entry.content || '').length > 200 ? '…' : ''}
                    </div>

                    ${keywords.length > 0 ? `
                        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">
                            ${keywords.map(k => `<span class="badge badge-accent" style="font-size:0.65rem">${k}</span>`).join('')}
                            ${(entry.keywords || []).length > 5 ? `<span class="badge badge-warning" style="font-size:0.65rem">+${entry.keywords.length - 5}</span>` : ''}
                        </div>
                    ` : ''}

                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.72rem;color:var(--text-muted)">
                        <div style="display:flex;gap:8px">
                            <span>优先级: ${entry.priority || 5}</span>
                            <span>~${tokenEst} tk</span>
                            ${entry.triggerChance != null && entry.triggerChance < 100 ? `<span>触发率: ${entry.triggerChance}%</span>` : ''}
                        </div>
                        <div style="display:flex;gap:4px">
                            <button class="btn-icon" style="width:24px;height:24px;font-size:0.7rem" onclick="event.stopPropagation();APP.editWorldEntry('${entry.id}')">✏️</button>
                            <button class="btn-icon" style="width:24px;height:24px;font-size:0.7rem" onclick="event.stopPropagation();APP.deleteWorldEntry('${entry.id}')">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        };

        APP.filterWorldEntries = function(type, btn) {
            document.querySelectorAll('.wb-filter').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            document.querySelectorAll('.wb-entry-card').forEach(card => {
                if (type === 'all' || card.dataset.type === type) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        APP.createWorldEntry = async function() {
            if (!APP.state.currentProject) return APP.toast('请先打开项目', 'warning');

            const entry = {
                id: DB.uid(),
                projectId: APP.state.currentProject.id,
                name: '',
                type: 'other',
                content: '',
                keywords: [],
                priority: 5,
                enabled: true,
                triggerChance: 100,
                recursiveScan: true,
                chapterRange: null,
                characterFilter: [],
                tokenBudget: null,
                stickyDuration: null,
                cooldown: null,
                versionHistory: [],
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };

            APP._openWorldEntryEditor(entry, true);
        };

        APP.editWorldEntry = async function(entryId) {
            const entry = await DB.get('worldEntries', entryId);
            if (!entry) return APP.toast('条目不存在', 'error');
            APP._openWorldEntryEditor(entry, false);
        };

        APP._openWorldEntryEditor = function(entry, isNew) {
            let overlay = document.getElementById('modal-worldEntry');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'modal-worldEntry';
                overlay.innerHTML = `
                    <div class="modal" style="max-width:800px;height:85vh">
                        <div class="modal-header">
                            <h3 id="weEditorTitle">编辑世界书条目</h3>
                            <button class="btn-icon" onclick="APP.closeModal('worldEntry')">✕</button>
                        </div>
                        <div class="modal-body" id="weEditorBody" style="overflow-y:auto"></div>
                        <div class="modal-footer" id="weEditorFooter"></div>
                    </div>`;
                document.body.appendChild(overlay);
            }

            document.getElementById('weEditorTitle').textContent = isNew ? '✨ 创建世界书条目' : `✏️ 编辑: ${entry.name || '未命名'}`;

            const typeOptions = [
                { value: 'character', label: '👤 角色' },
                { value: 'location', label: '📍 地点' },
                { value: 'item', label: '🔮 物品' },
                { value: 'event', label: '⚡ 事件' },
                { value: 'rule', label: '📜 规则' },
                { value: 'organization', label: '🏛️ 组织' },
                { value: 'lore', label: '📚 传说' },
                { value: 'other', label: '📌 其他' },
            ];

            document.getElementById('weEditorBody').innerHTML = `
                <div class="tabs" style="margin-bottom:16px" id="weTabs">
                    <button class="tab-item active" onclick="APP._switchWETab('basic', this)">📝 基础</button>
                    <button class="tab-item" onclick="APP._switchWETab('trigger', this)">🔑 触发</button>
                    <button class="tab-item" onclick="APP._switchWETab('advanced', this)">⚙️ 高级</button>
                    <button class="tab-item" onclick="APP._switchWETab('history', this)">📋 版本</button>
                </div>

                <!-- 基础信息 -->
                <div class="we-tab-content" id="weTab-basic">
                    <div class="form-row">
                        <div class="form-group">
                            <label>条目名称 *</label>
                            <input id="we_name" value="${entry.name || ''}" placeholder="例如：灵能学院" />
                        </div>
                        <div class="form-group" style="max-width:160px">
                            <label>类型</label>
                            <div class="select-wrapper">
                                <select id="we_type">
                                    ${typeOptions.map(o => `<option value="${o.value}" ${entry.type === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>内容描述</label>
                        <textarea id="we_content" rows="10" placeholder="详细描述这个设定的所有信息…">${entry.content || ''}</textarea>
                    </div>

                    <div class="form-group">
                        <label>关键词（逗号分隔，当文本中出现这些词时此条目被激活）</label>
                        <input id="we_keywords" value="${(entry.keywords || []).join(', ')}" placeholder="灵能学院, 学院, 灵能" />
                    </div>

                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:8px;margin-bottom:0">
                            启用
                            <label class="toggle-switch">
                                <input type="checkbox" id="we_enabled" ${entry.enabled !== false ? 'checked' : ''} />
                                <span class="toggle-slider"></span>
                            </label>
                        </label>
                    </div>
                </div>

                <!-- 触发设置 -->
                <div class="we-tab-content" id="weTab-trigger" style="display:none">
                    <div class="form-group">
                        <label>优先级 (1=最低, 10=最高，高优先级条目先被注入)</label>
                        <div class="slider-group">
                            <input type="range" min="1" max="10" value="${entry.priority || 5}" id="we_priority" oninput="this.nextElementSibling.textContent=this.value" />
                            <span class="slider-value">${entry.priority || 5}</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>触发概率 (100%=每次必定触发)</label>
                        <div class="slider-group">
                            <input type="range" min="0" max="100" value="${entry.triggerChance ?? 100}" id="we_triggerChance" oninput="this.nextElementSibling.textContent=this.value+'%'" />
                            <span class="slider-value">${entry.triggerChance ?? 100}%</span>
                        </div>
                    </div>

                    <div class="form-group" style="display:flex;align-items:center;justify-content:space-between">
                        <label style="margin:0">递归扫描 (此条目内容中的关键词也会触发其他条目)</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="we_recursive" ${entry.recursiveScan !== false ? 'checked' : ''} />
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label>生效章节范围（留空=全部章节）</label>
                        <div class="form-row">
                            <div>
                                <label style="font-size:0.75rem">起始章</label>
                                <input type="number" id="we_chStart" min="1" value="${entry.chapterRange?.start || ''}" placeholder="不限" />
                            </div>

        APP._switchWETab = function(tab, btn) {
            document.querySelectorAll('#weTabs .tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.we-tab-content').forEach(c => c.style.display = 'none');
            if (btn) btn.classList.add('active');
            const el = document.getElementById(`weTab-${tab}`);
            if (el) el.style.display = 'block';
        };

        APP._saveWorldEntry = async function(entryId, isNew) {
            const name = document.getElementById('we_name').value.trim();
            if (!name) return APP.toast('请输入条目名称', 'warning');

            let entry;
            if (isNew) {
                entry = {
                    id: entryId,
                    projectId: APP.state.currentProject.id,
                    versionHistory: [],
                    createdAt: Date.now(),
                };
            } else {
                entry = await DB.get('worldEntries', entryId);
                if (!entry) return APP.toast('条目不存在', 'error');

                // 保存旧版本到历史
                entry.versionHistory = entry.versionHistory || [];
                entry.versionHistory.push({
                    content: entry.content,
                    keywords: [...(entry.keywords || [])],
                    timestamp: Date.now(),
                    reason: '手动编辑',
                });

                // 最多保留20个版本
                if (entry.versionHistory.length > 20) {
                    entry.versionHistory = entry.versionHistory.slice(-20);
                }
            }

            entry.name = name;
            entry.type = document.getElementById('we_type').value;
            entry.content = document.getElementById('we_content').value.trim();
            entry.keywords = document.getElementById('we_keywords').value.split(',').map(k => k.trim()).filter(Boolean);
            entry.enabled = document.getElementById('we_enabled').checked;
            entry.priority = parseInt(document.getElementById('we_priority').value) || 5;
            entry.triggerChance = parseInt(document.getElementById('we_triggerChance').value) ?? 100;
            entry.recursiveScan = document.getElementById('we_recursive').checked;

            const chStart = document.getElementById('we_chStart').value;
            const chEnd = document.getElementById('we_chEnd').value;
            entry.chapterRange = (chStart || chEnd) ? {
                start: chStart ? parseInt(chStart) : null,
                end: chEnd ? parseInt(chEnd) : null,
            } : null;

            entry.characterFilter = document.getElementById('we_charFilter').value.split(',').map(k => k.trim()).filter(Boolean);
            entry.tokenBudget = parseInt(document.getElementById('we_tokenBudget').value) || 0;
            entry.stickyDuration = parseInt(document.getElementById('we_sticky').value) || 0;
            entry.cooldown = parseInt(document.getElementById('we_cooldown').value) || 0;

            entry.updatedAt = Date.now();

            await DB.put('worldEntries', entry);
            APP.closeModal('worldEntry');
            APP.loadWorldbookPage();
            APP.renderSidebar();
            APP.toast(`条目「${name}」已${isNew ? '创建' : '保存'}`, 'success');
        };

        APP.deleteWorldEntry = async function(entryId) {
            const entry = await DB.get('worldEntries', entryId);
            if (!entry) return;

            const ok = await APP.confirm('删除条目', `确定删除「${entry.name}」？此操作不可恢复。`);
            if (!ok) return;

            await DB.delete('worldEntries', entryId);
            APP.loadWorldbookPage();
            APP.renderSidebar();
            APP.toast('条目已删除', 'success');
        };

        APP.toggleWorldEntry = async function(entryId, enabled) {
            const entry = await DB.get('worldEntries', entryId);
            if (!entry) return;
            entry.enabled = enabled;
            entry.updatedAt = Date.now();
            await DB.put('worldEntries', entry);
        };

        APP.restoreWorldEntryVersion = async function(entryId, versionIndex) {
            const entry = await DB.get('worldEntries', entryId);
            if (!entry || !entry.versionHistory?.[versionIndex]) return;

            const version = entry.versionHistory[versionIndex];
            const ok = await APP.confirm('恢复版本', '将内容恢复到此版本？当前内容会保存到版本历史。');
            if (!ok) return;

            // 当前内容存入历史
            entry.versionHistory.push({
                content: entry.content,
                keywords: [...(entry.keywords || [])],
                timestamp: Date.now(),
                reason: '恢复前自动备份',
            });

            entry.content = version.content;
            if (version.keywords) entry.keywords = [...version.keywords];
            entry.updatedAt = Date.now();
            await DB.put('worldEntries', entry);

            APP._openWorldEntryEditor(entry, false);
            APP.toast('已恢复到选定版本', 'success');
        };

        // ----- AI辅助功能 -----

        // ----- 世界书AI智能迭代 -----
        APP.aiIterateWorldbook = async function() {
            if (!APP.state.currentProject) return;

            const projectId = APP.state.currentProject.id;
            const editor = document.getElementById('editor');
            const recentText = editor ? (editor.innerText || '').slice(-4000) : '';

            if (!recentText.trim()) return APP.toast('当前没有创作内容，无法进行迭代', 'warning');

            const entries = await DB.getAllByIndex('worldEntries', 'projectId', projectId);
            if (entries.length === 0) return APP.toast('世界书为空，请先创建条目', 'warning');

            APP.toast('AI正在分析剧情变化并提出世界书修改建议…', 'info');

            try {
                const entrySummary = entries.slice(0, 30).map(e =>
                    `[${e.name}] (${e.type}): ${(e.content || '').slice(0, 150)}`
                ).join('\n');

                const messages = [
                    { role: 'system', content: `你是一个世界观维护专家。请分析最近的剧情发展，判断现有世界书条目中哪些需要更新。

重要规则：
1. 只提出确实需要修改的条目
2. 迭代是"替换式"的——给出修改后的完整内容，而不是追加
3. 如果角色关系变了，更新关系描述并删除过时的部分
4. 控制每个条目的长度，避免越来越长
5. 输出JSON格式` },
                    { role: 'user', content: `【现有世界书条目】
${entrySummary}

【最近的剧情发展】
${recentText}

请分析是否有条目需要更新。输出JSON数组格式：
[{
    "entryName": "条目名称",
    "action": "update" 或 "no_change",
    "reason": "修改原因",
    "newContent": "修改后的完整内容（仅action=update时需要）"
}]

只输出需要update的条目。如果没有需要修改的，输出空数组 []。` }
                ];

                const result = await AI.call('worldbook', messages, { max_tokens: 4000 });

                let proposals;
                try {
                    const jsonStr = result.content.replace(/```json?\n?/g, '').replace(/```/g, '').trim();
                    proposals = JSON.parse(jsonStr);
                } catch {
                    APP.toast('AI返回格式无法解析', 'error');
                    return;
                }

                if (!Array.isArray(proposals) || proposals.length === 0) {
                    APP.toast('AI认为当前无需更新世界书', 'info');
                    return;
                }

                // 显示修改提案
                APP._showIterationProposals(proposals, entries);

            } catch (e) {
                APP.toast('AI迭代失败: ' + e.message, 'error');
            }
        };

        APP._showIterationProposals = function(proposals, entries) {
            let overlay = document.getElementById('modal-iterateProposal');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'modal-overlay';

                        <div class="modal-header">

                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="APP.closeModal('iterateProposal')">取消</button>

                </div>

                ${proposals.map((p, i) => {
                    const existingEntry = entries.find(e => e.name === p.entryName);
                    return `
                        <div class="card" style="margin-bottom:10px;padding:12px">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                                <input type="checkbox" id="iterate_check_${i}" checked style="width:16px;height:16px;cursor:pointer" />

                                    <div>
                                        <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:4px">原内容：</div>
                                        <div style="font-size:0.8rem;padding:8px;background:var(--bg-primary);border-radius:var(--radius-sm); max-height:120px;overflow-y:auto;border:1px solid rgba(255,82,82,0.2);line-height:1.6">
                                            ${(existingEntry.content || '').slice(0, 300)}${existingEntry.content?.length > 300 ? '…' : ''}
                                        </div>

                                        <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:4px">修改后：</div>

                                            ${(p.newContent || '').slice(0, 300)}${p.newContent?.length > 300 ? '…' : ''}

                                    </div>
                                </div>
                            ` : `
                                <div style="font-size:0.8rem;padding:8px;background:var(--bg-primary);border-radius:var(--radius-sm);line-height:1.6">

        APP._applyIterationProposals = async function() {
            const proposals = APP._iterationProposals || [];
            const entries = APP._iterationEntries || [];

            let applied = 0;

            for (let i = 0; i < proposals.length; i++) {
                const checkbox = document.getElementById(`iterate_check_${i}`);
                if (!checkbox || !checkbox.checked) continue;

                const p = proposals[i];
                const existing = entries.find(e => e.name === p.entryName);

                if (existing && p.newContent) {
                    // 保存旧版本
                    existing.versionHistory = existing.versionHistory || [];
                    existing.versionHistory.push({
                        content: existing.content,
                        keywords: [...(existing.keywords || [])],
                        timestamp: Date.now(),
                        reason: `AI迭代: ${p.reason}`,
                    });

                    existing.content = p.newContent;
                    existing.updatedAt = Date.now();
                    await DB.put('worldEntries', existing);
                    applied++;
                }
            }

            APP.closeModal('iterateProposal');
            APP.loadWorldbookPage();
            APP.renderSidebar();
            APP.toast(`已应用 ${applied} 项修改`, 'success');
        };

        APP.importWorldbook = async function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    const data = JSON.parse(await file.text());
                    const items = Array.isArray(data) ? data : (data.entries || data.worldEntries || [data]);

                    let count = 0;
                    for (const item of items) {
                        const entry = {
                            id: DB.uid(),
                            projectId: APP.state.currentProject.id,
                            name: item.name || item.comment || '未命名',
                            type: item.type || 'other',
                            content: item.content || item.description || '',
                            keywords: item.keywords || item.keys || [],
                            priority: item.priority || 5,
                            enabled: true,
                            triggerChance: 100,
                            recursiveScan: true,
                            versionHistory: [],
                            createdAt: Date.now(),
                            updatedAt: Date.now(),
                        };
                        await DB.put('worldEntries', entry);
                        count++;
                    }

                    APP.loadWorldbookPage();
                    APP.renderSidebar();
                    APP.toast(`已导入 ${count} 个条目`, 'success');
                } catch (err) {
                    APP.toast('导入失败: ' + err.message, 'error');
                }
            };
            input.click();
        };

            const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Worldbook_${APP.state.currentProject.name}.json`;
            a.click();

            APP.toast('世界书已导出', 'success');

        APP._switchCharTab = function(tab, btn) {
            document.querySelectorAll('#charTabs .tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.char-tab').forEach(c => c.style.display = 'none');
            if (btn) btn.classList.add('active');

            if (el) el.style.display = 'block';
        };

        APP._addCharRelation = function() {
            const name = prompt('关系对象（角色名）：');
            if (!name) return;

            const type = prompt('关系类型（如：恋人/朋友/对手/师徒/仇敌）：');
            if (!type) return;

            const detail = prompt('关系描述（可留空）：', '');
            const intimacy = prompt('亲密度 (0-100，可留空)：', '');

            APP._editingRelationships.push({
                targetName: name,
                type,
                detail: detail || '',
                intimacy: intimacy ? parseInt(intimacy) : null,
            });

            // 刷新关系列表显示
            const list = document.getElementById('charRelationsList');
            if (list) {
                const r = APP._editingRelationships;
                list.innerHTML = r.map((rel, i) => `
                    <div class="card" style="padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
                        <span style="flex:1">

                        <button class="btn-icon" style="width:20px;height:20px;font-size:0.65rem" onclick="APP._removeCharRelation(${i})">🗑️</button>
                    </div>
                `).join('');
            }
        };

        APP._removeCharRelation = function(index) {
            APP._editingRelationships.splice(index, 1);

            // 简单刷新
            const list = document.getElementById('charRelationsList');
            if (list) {
                list.innerHTML = APP._editingRelationships.map((rel, i) => `
                    <div class="card" style="padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
                        <span style="flex:1"><strong>${rel.targetName}</strong> — <span style="color:var(--accent-primary)">${rel.type}</span></span>
                        <button class="btn-icon" style="width:20px;height:20px;font-size:0.65rem" onclick="APP._removeCharRelation(${i})">🗑️</button>
                    </div>
                `).join('');

        };

        APP._saveCharacter = async function(charId, isNew) {
            const name = document.getElementById('ch_name').value.trim();
            if (!name) return APP.toast('请输入角色名', 'warning');

            const character = isNew ? {
                id: charId,
                projectId: APP.state.currentProject.id,
                createdAt: Date.now(),
            } : await DB.get('characters', charId);

            if (!character) return APP.toast('角色不存在', 'error');

            character.name = name;
            character.aliases = document.getElementById('ch_aliases').value.split(',').map(a => a.trim()).filter(Boolean);
            character.avatar = document.getElementById('ch_avatar').value || '👤';
            character.role = document.getElementById('ch_role').value.trim();
            character.roleType = document.getElementById('ch_roleType').value;
            character.tags = document.getElementById('ch_tags').value.split(',').map(t => t.trim()).filter(Boolean);
            character.backstory = document.getElementById('ch_backstory').value.trim();
            character.motivation = document.getElementById('ch_motivation').value.trim();
            character.arc = document.getElementById('ch_arc').value.trim();

            // 外貌
            character.appearance = document.getElementById('ch_appearance').value.trim();
            character.appearanceDetail = {
                face: document.getElementById('ch_ad_face').value.trim(),
                hair: document.getElementById('ch_ad_hair').value.trim(),
                eyes: document.getElementById('ch_ad_eyes').value.trim(),
                body: document.getElementById('ch_ad_body').value.trim(),
                height: document.getElementById('ch_ad_height').value.trim(),
                distinguishing: document.getElementById('ch_ad_distinguishing').value.trim(),
            };

            // 性格
            character.personality = document.getElementById('ch_personality').value.trim();
            character.personalityLayers = {
                core: document.getElementById('ch_pl_core').value.trim(),
                surface: document.getElementById('ch_pl_surface').value.trim(),
                hidden: document.getElementById('ch_pl_hidden').value.trim(),
            };

            // 语言
            character.speechStyle = document.getElementById('ch_speechStyle').value.trim();
            character.speechPatterns = {
                quirks: document.getElementById('ch_sp_quirks').value.trim(),
                tone: document.getElementById('ch_sp_tone').value.trim(),
                vocabulary: document.getElementById('ch_sp_vocabulary').value.trim(),
                formality: document.getElementById('ch_sp_formality').value.trim(),
            };

            // NSFW
            character.nsfwTraits = document.getElementById('ch_nsfwTraits').value.trim();
            character.nsfwProfile = {
                orientation: document.getElementById('ch_np_orientation').value.trim(),
                preferences: document.getElementById('ch_np_preferences').value.trim(),
                reactions: document.getElementById('ch_np_reactions').value.trim(),
                verbalStyle: document.getElementById('ch_np_verbalStyle').value.trim(),
                sensitivity: document.getElementById('ch_np_sensitivity').value.trim(),
            };

            // 关系
            character.relationships = APP._editingRelationships || [];

            // 视觉
            character.visualPrompt = document.getElementById('ch_visualPrompt').value.trim();

            character.updatedAt = Date.now();

            await DB.put('characters', character);

            // 同步到世界书（自动创建/更新角色类型条目）
            await APP._syncCharacterToWorldbook(character);

            APP.closeModal('charEditor');
            APP.loadCharactersPage();
            APP.renderSidebar();
            APP.toast(`角色「${name}」已${isNew ? '创建' : '保存'}`, 'success');
        };

        APP._syncCharacterToWorldbook = async function(character) {
            const projectId = character.projectId;
            const entries = await DB.getAllByIndex('worldEntries', 'projectId', projectId);
            let entry = entries.find(e => e.type === 'character' && e.name === character.name);

            const content = [
                character.role ? `身份：${character.role}` : '',
                character.appearance ? `外貌：${character.appearance}` : '',
                character.personality ? `性格：${character.personality}` : '',
                character.speechStyle ? `说话方式：${character.speechStyle}` : '',
                character.nsfwTraits ? `亲密特征：${character.nsfwTraits}` : '',
                character.relationships?.length ? `关系：${character.relationships.map(r => `${r.targetName}(${r.type})`).join('、')}` : '',
            ].filter(Boolean).join('\n');

            const keywords = [character.name, ...(character.aliases || [])];

            if (entry) {
                entry.content = content;
                entry.keywords = keywords;
                entry.updatedAt = Date.now();
                await DB.put('worldEntries', entry);
            } else {
                await DB.put('worldEntries', {
                    id: DB.uid(),
                    projectId,
                    name: character.name,
                    type: 'character',
                    content,
                    keywords,
                    priority: 7,
                    enabled: true,
                    triggerChance: 100,
                    recursiveScan: true,
                    versionHistory: [],
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                });
            }
        };

        APP._deleteCharacter = async function(charId) {
            const ch = await DB.get('characters', charId);
            if (!ch) return;

            const ok = await APP.confirm('删除角色', `确定删除「${ch.name}」？`);
            if (!ok) return;

            await DB.delete('characters', charId);
            APP.closeModal('charEditor');
            APP.loadCharactersPage();
            APP.renderSidebar();
            APP.toast('角色已删除', 'success');
        };

        // ----- 角色AI辅助功能 -----
        APP.aiExpandAppearance = async function() {
            const name = document.getElementById('ch_name').value.trim();
            const existing = document.getElementById('ch_appearance').value.trim();
            const detail = document.getElementById('ch_ad_body').value.trim();

            if (!name) return APP.toast('请先填写角色名', 'warning');

            APP.toast('AI正在完善外貌…', 'info');

            try {
                const messages = [
                    { role: 'system', content: '你是角色设计专家。根据已有信息生成详细的外貌描述，适合小说使用，注重画面感。只输出外貌描述文本。' },
                    { role: 'user', content: `角色：${name}\n已有外貌：${existing || '(空)'}\n体型：${detail || '(空)'}\n\n请生成200字左右的详细外貌描述。` }
                ];

                const result = await AI.call('worldbook', messages);
                document.getElementById('ch_appearance').value = result.content;
                APP.toast('外貌已完善', 'success');
            } catch (e) {
                APP.toast('失败: ' + e.message, 'error');
            }
        };

        APP.aiExpandPersonality = async function() {
            const name = document.getElementById('ch_name').value.trim();
            const existing = document.getElementById('ch_personality').value.trim();

            if (!name) return APP.toast('请先填写角色名', 'warning');

            APP.toast('AI正在完善性格…', 'info');

            try {
                const messages = [
                    { role: 'system', content: '你是角色心理学专家。根据已有信息，分析并补充角色的核心性格、表面性格和隐藏性格。输出JSON：{"core":"核心性格","surface":"表面性格","hidden":"隐藏性格","overall":"性格总述"}' },
                    { role: 'user', content: `角色：${name}\n已有性格：${existing || '(空)'}\n\n请完善三层性格。` }
                ];

                const result = await AI.call('worldbook', messages);
                const jsonStr = result.content.replace(/```json?\n?/g, '').replace(/```/g, '').trim();
                const data = JSON.parse(jsonStr);

                if (data.core) document.getElementById('ch_pl_core').value = data.core;
                if (data.surface) document.getElementById('ch_pl_surface').value = data.surface;
                if (data.hidden) document.getElementById('ch_pl_hidden').value = data.hidden;
                if (data.overall) document.getElementById('ch_personality').value = data.overall;

                APP.toast('性格已完善', 'success');
            } catch (e) {
                APP.toast('失败: ' + e.message, 'error');
            }
        };

        APP.aiSuggestRelations = async function() {
            if (!APP.state.currentProject) return;

            const name = document.getElementById('ch_name').value.trim();
            if (!name) return APP.toast('请先填写角色名', 'warning');

            const characters = await DB.getAllByIndex('characters', 'projectId', APP.state.currentProject.id);
            const others = characters.filter(c => c.name !== name).map(c => c.name);

            if (others.length === 0) return APP.toast('项目中没有其他角色', 'info');

            APP.toast('AI正在建议关系…', 'info');

            try {
                const messages = [
                    { role: 'system', content: '根据角色信息建议合理的角色关系。输出JSON数组：[{"targetName":"","type":"","detail":"","intimacy":50}]' },
                    { role: 'user', content: `角色：${name}\n其他角色：${others.join(', ')}\n\n请建议${name}与其他角色的关系。` }
                ];

                const result = await AI.call('worldbook', messages);
                const jsonStr = result.content.replace(/```json?\n?/g, '').replace(/```/g, '').trim();
                const suggestions = JSON.parse(jsonStr);

                suggestions.forEach(s => {
                    if (!APP._editingRelationships.find(r => r.targetName === s.targetName)) {
                        APP._editingRelationships.push(s);
                    }
                });

                // 刷新显示
                const list = document.getElementById('charRelationsList');
                if (list) {
                    list.innerHTML = APP._editingRelationships.map((rel, i) => `
                        <div class="card" style="padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
                            <span style="flex:1"><strong>${rel.targetName}</strong> — <span style="color:var(--accent-primary)">${rel.type}</span> ${rel.detail ? ` · ${rel.detail}` : ''}</span>
                            ${rel.intimacy != null ? `<span class="badge badge-nsfw" style="font-size:0.65rem">亲密度:${rel.intimacy}</span>` : ''}
                            <button class="btn-icon" style="width:20px;height:20px;font-size:0.65rem" onclick="APP._removeCharRelation(${i})">🗑️</button>
                        </div>
                    `).join('');
                }

                APP.toast('关系建议已添加', 'success');
            } catch (e) {
                APP.toast('失败: ' + e.message, 'error');
            }
        };

        APP.aiGenerateVisualPrompt = async function() {
            const appearance = document.getElementById('ch_appearance').value.trim();
            const ad = {
                face: document.getElementById('ch_ad_face').value.trim(),
                hair: document.getElementById('ch_ad_hair').value.trim(),
